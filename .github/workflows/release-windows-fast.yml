name: Release Windows build (FAST / paid 16-core)

# Single-shot Windows build on a GitHub-hosted LARGER runner (16-core,
# 64GB). At 16 cores Chromium compiles in ~2-2.5h — well under any cap,
# no resume needed, no mtime issues. This is the "ship Windows TODAY"
# path. Cost: ~$0.064/min × ~150min ≈ $10-15 for one build.
#
# PREREQUISITE (one-time, owner action):
#   GitHub → repo Settings → Actions → Runners → "New runner" →
#   "New GitHub-hosted runner" → OS: Windows, size: 16-core, give it the
#   label "windows-16core". This requires Actions billing enabled
#   (Settings → Billing → set a spending limit > $0).
# Once that runner label exists, trigger this workflow:
#   gh workflow run release-windows-fast.yml -f tag=v0.2.1
#
# After Windows ships, this workflow can sit unused (no cost when idle).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to attach the .exe to'
        required: true
        type: string
        default: 'v0.2.1'

permissions:
  contents: read

jobs:
  build-windows-fast:
    # The 16-core larger-runner label the owner created. If you named it
    # differently, change this line.
    runs-on: windows-16core
    timeout-minutes: 300   # plenty for a ~2.5h build on 16 cores
    permissions:
      contents: write       # upload release assets
      id-token: write       # build-provenance attestation (OIDC)
      attestations: write

    defaults:
      run:
        shell: bash

    env:
      # CHROMIUM_REVISION is read from chromium_version.txt after checkout.
      # User input reaches shell steps only through the environment.
      TAG: ${{ inputs.tag }}
      MOLT_RELEASE_BUILD: "1"   # bundle downloads must match their pins
      DEPOT_TOOLS_WIN_TOOLCHAIN: "0"
      GYP_MSVS_VERSION: "2022"
      MSYS_NO_PATHCONV: "1"
      MSYS2_ARG_CONV_EXCL: "*"

    steps:
      - name: Check out repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Read Chromium pin (chromium_version.txt) + validate tag
        run: |
          tools/chromium/pin.sh env >> "$GITHUB_ENV"
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$TAG' is not a release tag (vX.Y.Z[-suffix])"
            exit 1
          fi

      - name: Free up disk
        run: |
          df -h || true
          rm -rf "/c/Program Files (x86)/Android" || true
          rm -rf "/c/Program Files (x86)/Microsoft Visual Studio/2019" || true
          df -h || true

      - name: Install depot_tools
        run: |
          git clone --depth 1 \
            https://chromium.googlesource.com/chromium/tools/depot_tools.git \
            "$HOME/depot_tools"
          echo "$HOME/depot_tools" >> "$GITHUB_PATH"

      - name: Bootstrap depot_tools
        env:
          DEPOT_TOOLS_UPDATE: "1"
        run: |
          cd "$HOME/depot_tools"
          ./update_depot_tools.bat || true
          ./gclient --version || true

      - name: Sync Chromium source (pinned)
        env:
          DEPOT_TOOLS_UPDATE: "0"
        run: |
          set -x
          mkdir -p chromium && cd chromium
          cat > .gclient <<'EOF'
          solutions = [
            {
              "name": "src",
              "url": "https://chromium.googlesource.com/chromium/src.git",
              "custom_deps": {},
              "custom_vars": {},
            },
          ]
          target_os = ['win']
          EOF
          if [ ! -d src/.git ]; then
            mkdir -p src
            (cd src && \
              git init -q && \
              git remote add origin https://chromium.googlesource.com/chromium/src.git && \
              git fetch --depth=1 --no-tags origin "${CHROMIUM_REVISION}" && \
              git checkout --detach FETCH_HEAD)
          fi
          gclient sync --revision "src@${CHROMIUM_REVISION}" --no-history --shallow

      - name: Copy MoltBrowser overlays
        run: cp -r src/* chromium/src/

      - name: Configure (gn gen)
        run: ./scripts/configure.sh --platform windows --arch x64

      - name: Build chrome (full, 16 cores)
        run: |
          export PATH="$HOME/depot_tools:$PATH"
          cd chromium/src
          autoninja -C out/MoltBrowser chrome

      - name: Package + checksums
        id: package
        run: |
          # dist/ may hold earlier packages: never let a stale one be published.
          rm -f dist/MoltBrowser-*-win-x64-setup.exe dist/MoltBrowser-*-win-x64-portable.zip \
            dist/MoltBrowser-Windows-x64-Setup.exe dist/MoltBrowser-Windows-x64.zip
          ./scripts/package-win.sh --version "$TAG"
          cd dist
          # Exactly one installer (required) and at most one portable zip.
          mapfile -t setup < <(compgen -G 'MoltBrowser-*-win-x64-setup.exe')
          if [ "${#setup[@]}" -ne 1 ]; then
            echo "::error::expected one installer in dist/, found ${#setup[@]}: ${setup[*]}"
            exit 1
          fi
          mv "${setup[0]}" MoltBrowser-Windows-x64-Setup.exe
          mapfile -t zips < <(compgen -G 'MoltBrowser-*-win-x64-portable.zip')
          if [ "${#zips[@]}" -gt 1 ]; then
            echo "::error::more than one portable zip in dist/: ${zips[*]}"
            exit 1
          fi
          [ "${#zips[@]}" -eq 1 ] && mv "${zips[0]}" MoltBrowser-Windows-x64.zip
          ls -lh
          files=(MoltBrowser-Windows-x64-Setup.exe)
          [ -f MoltBrowser-Windows-x64.zip ] && files+=(MoltBrowser-Windows-x64.zip)
          ../scripts/release-checksums.sh SHA256SUMS-windows-x64 "${files[@]}"
          { echo "files<<EOF"; printf 'dist/%s\n' "${files[@]}"; echo "EOF"; } >> "$GITHUB_OUTPUT"

      - name: Build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.files }}

      - name: Upload to the DRAFT release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FILES: ${{ steps.package.outputs.files }}
        run: |
          ./scripts/release-draft.sh "$TAG" --repo "$GITHUB_REPOSITORY"
          mapfile -t files <<< "$FILES"
          gh release upload "$TAG" "${files[@]}" dist/SHA256SUMS-windows-x64 \
            --repo "$GITHUB_REPOSITORY" --clobber
          echo "Windows assets uploaded. The release stays a DRAFT until the signed manifest is attached."

name: Release Windows build (FAST / paid 16-core)

# Single-shot Windows build on a GitHub-hosted LARGER runner (16-core,
# 64GB). At 16 cores Chromium compiles in ~2-2.5h — well under any cap,
# no resume needed, no mtime issues. This is the "ship Windows TODAY"
# path. Cost: ~$0.064/min × ~150min ≈ $10-15 for one build.
#
# PREREQUISITE (one-time, owner action):
#   GitHub → repo Settings → Actions → Runners → "New runner" →
#   "New GitHub-hosted runner" → OS: Windows, size: 16-core, give it the
#   label "windows-16core". This requires Actions billing enabled
#   (Settings → Billing → set a spending limit > $0).
# Once that runner label exists, trigger this workflow:
#   gh workflow run release-windows-fast.yml -f tag=v0.2.1
#
# After Windows ships, this workflow can sit unused (no cost when idle).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to attach the .exe to'
        required: true
        type: string
        default: 'v0.2.1'

permissions:
  contents: write

jobs:
  build-windows-fast:
    # The 16-core larger-runner label the owner created. If you named it
    # differently, change this line.
    runs-on: windows-16core
    timeout-minutes: 300   # plenty for a ~2.5h build on 16 cores

    defaults:
      run:
        shell: bash

    env:
      CHROMIUM_REVISION: "51a413be46f7632ebc3ae331c68af71daa5d6bbf"
      DEPOT_TOOLS_WIN_TOOLCHAIN: "0"
      GYP_MSVS_VERSION: "2022"
      MSYS_NO_PATHCONV: "1"
      MSYS2_ARG_CONV_EXCL: "*"

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Free up disk
        run: |
          df -h || true
          rm -rf "/c/Program Files (x86)/Android" || true
          rm -rf "/c/Program Files (x86)/Microsoft Visual Studio/2019" || true
          df -h || true

      - name: Install depot_tools
        run: |
          git clone --depth 1 \
            https://chromium.googlesource.com/chromium/tools/depot_tools.git \
            "$HOME/depot_tools"
          echo "$HOME/depot_tools" >> $GITHUB_PATH

      - name: Bootstrap depot_tools
        env:
          DEPOT_TOOLS_UPDATE: "1"
        run: |
          cd "$HOME/depot_tools"
          ./update_depot_tools.bat || true
          ./gclient --version || true

      - name: Sync Chromium source (pinned)
        env:
          DEPOT_TOOLS_UPDATE: "0"
        run: |
          set -x
          mkdir -p chromium && cd chromium
          cat > .gclient <<'EOF'
          solutions = [
            {
              "name": "src",
              "url": "https://chromium.googlesource.com/chromium/src.git",
              "custom_deps": {},
              "custom_vars": {},
            },
          ]
          target_os = ['win']
          EOF
          if [ ! -d src/.git ]; then
            mkdir -p src
            (cd src && \
              git init -q && \
              git remote add origin https://chromium.googlesource.com/chromium/src.git && \
              git fetch --depth=1 --no-tags origin "${CHROMIUM_REVISION}" && \
              git checkout --detach FETCH_HEAD)
          fi
          gclient sync --revision "src@${CHROMIUM_REVISION}" --no-history --shallow

      - name: Copy MoltBrowser overlays
        run: cp -r src/* chromium/src/

      - name: Configure (gn gen)
        run: ./scripts/configure.sh --platform windows --arch x64

      - name: Build chrome (full, 16 cores)
        run: |
          export PATH="$HOME/depot_tools:$PATH"
          cd chromium/src
          autoninja -C out/MoltBrowser chrome

      - name: Package + upload installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./scripts/package-win.sh --version "${{ inputs.tag }}" || true
          cd dist
          for f in MoltBrowser-*-win-x64-setup.exe; do
            mv "$f" MoltBrowser-Windows-x64-Setup.exe 2>/dev/null || true
          done
          for f in MoltBrowser-*-win-x64.zip; do
            mv "$f" MoltBrowser-Windows-x64.zip 2>/dev/null || true
          done
          ls -lh
          gh release upload "${{ inputs.tag }}" \
            MoltBrowser-Windows-x64-Setup.exe \
            --repo "${{ github.repository }}" --clobber
          [ -f MoltBrowser-Windows-x64.zip ] && \
            gh release upload "${{ inputs.tag }}" MoltBrowser-Windows-x64.zip \
              --repo "${{ github.repository }}" --clobber || true
          echo "🎉 Windows shipped via fast runner!"

name: Release Windows build (self-hosted)

# Builds Windows x64 on a self-hosted runner (the user's Windows PC).
# No 6h cap (self-hosted), single continuous build.
#
# LESSON 1 - shells: depot_tools (gclient/gn/ninja) must run in a NATIVE
# Windows shell (PowerShell/cmd), NOT Git Bash. Bash mangles /c/ paths
# into C:\c\ when depot_tools hands off to its bundled Python. So every
# depot_tools + build step below uses `shell: powershell`.
#
# LESSON 2 - MAX_PATH: the Actions workspace
# (C:\Users\<u>\actions-runner\_work\MoltBrowser\MoltBrowser\chromium\ =
# 73 chars) plus Chromium's vendored depot_tools gsutil tree produces a
# 261-char path - 1 over Windows' 260 MAX_PATH - so gsutil's self-extract
# drops a file and `gclient sync` dies (FileNotFoundError on rc.exe hook).
# Fix: sync + build from a SHORT root, C:\cr (canonical Chromium-on-Win
# workaround). Same path drops to ~194 chars. C:\cr is OUTSIDE the
# workspace, so it also persists across runs for free.
#
# LESSON 3 - PATH: the runner's PATH can predate the Git install, so we
# locate git ourselves (see "Locate git").
#
# Prereqs on the PC: Visual Studio 2022 (Desktop C++ workload) + Windows
# SDK, ~100GB disk, Git for Windows. Runner registered as self-hosted.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to attach the .exe to'
        required: true
        type: string
        default: 'v0.2.1'

permissions:
  contents: read

jobs:
  build-windows-selfhosted:
    runs-on: [self-hosted, windows, X64]
    timeout-minutes: 1200   # half-core thermal cap makes the laptop compile slow; generous headroom
    permissions:
      contents: write       # upload release assets
      id-token: write       # build-provenance attestation (OIDC)
      attestations: write

    env:
      # CHROMIUM_REVISION is read from chromium_version.txt after checkout.
      DEPOT_TOOLS_WIN_TOOLCHAIN: "0"
      GYP_MSVS_VERSION: "2022"
      BUILD_ROOT: 'C:\cr'   # short root - keeps Chromium paths under MAX_PATH
      # User input reaches PowerShell only through the environment.
      RELEASE_TAG: ${{ inputs.tag }}

    steps:
      # Corporate/fresh runners default PowerShell ExecutionPolicy to Restricted,
      # which blocks the temp .ps1 files GitHub Actions writes for every
      # `shell: powershell` step ("running scripts is disabled on this system").
      # Set it once for this user (no admin) via an INLINE command run from cmd
      # (cmd is not a .ps1, so the policy can't block this bootstrap step).
      - name: Allow PowerShell scripts on this runner
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -Command "Set-ExecutionPolicy -Scope CurrentUser -ExecutionPolicy RemoteSigned -Force"

      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          clean: false   # keep depot_tools/ between runs (C:\cr persists on its own)

      # Same values tools/chromium/pin.sh prints, parsed natively (no bash here).
      - name: Read Chromium pin (chromium_version.txt)
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $pin = @{}
          Get-Content chromium_version.txt | Where-Object { $_ -match '^(CHROMIUM_(VERSION|REVISION))=(.+)$' } | ForEach-Object {
            $kv = $_ -split '=', 2
            $pin[$kv[0]] = $kv[1].Trim()
          }
          if ($pin['CHROMIUM_REVISION'] -notmatch '^[0-9a-f]{40}$') { throw "bad CHROMIUM_REVISION in chromium_version.txt" }
          if ($pin['CHROMIUM_VERSION'] -notmatch '^\d+\.\d+\.\d+\.\d+$') { throw "bad CHROMIUM_VERSION in chromium_version.txt" }
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?$') { throw "'$($env:RELEASE_TAG)' is not a release tag (vX.Y.Z[-suffix])" }
          "CHROMIUM_REVISION=$($pin['CHROMIUM_REVISION'])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii
          "CHROMIUM_VERSION=$($pin['CHROMIUM_VERSION'])"   | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii
          Write-Host "Chromium pin: $($pin['CHROMIUM_VERSION']) ($($pin['CHROMIUM_REVISION']))"

      # The runner (run.cmd) was started before Git for Windows was
      # installed, so its PATH is stale and `git` isn't visible to the
      # steps it spawns. (That's also why actions/checkout silently falls
      # back to an API tarball.) Find git ourselves and put it on PATH.
      - name: Locate git + put it on PATH
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $g = Get-Command git -ErrorAction SilentlyContinue
          if ($g) {
            $dir = Split-Path $g.Source
            Write-Host "git already on PATH: $($g.Source)"
          } else {
            $cands = @(
              "$env:ProgramFiles\Git\cmd\git.exe",
              "${env:ProgramFiles(x86)}\Git\cmd\git.exe",
              "$env:LOCALAPPDATA\Programs\Git\cmd\git.exe",
              "$env:LOCALAPPDATA\Programs\Git\bin\git.exe",
              "$env:USERPROFILE\AppData\Local\Programs\Git\cmd\git.exe",
              "$env:USERPROFILE\scoop\apps\git\current\cmd\git.exe"
            )
            $hit = $cands | Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $hit) {
              Write-Host "Not in common spots; scanning install roots..."
              $roots = @("$env:LOCALAPPDATA\Programs", "$env:ProgramFiles", "${env:ProgramFiles(x86)}", "$env:USERPROFILE") |
                       Where-Object { $_ -and (Test-Path $_) }
              foreach ($r in $roots) {
                $f = Get-ChildItem -Path $r -Recurse -Filter git.exe -ErrorAction SilentlyContinue |
                     Where-Object { $_.FullName -match '\\cmd\\git\.exe$' } | Select-Object -First 1
                if ($f) { $hit = $f.FullName; break }
              }
            }
            if (-not $hit) { throw "git.exe not found. Install Git for Windows on the runner." }
            $dir = Split-Path $hit
            Write-Host "Found git: $hit"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $dir
          Write-Host "git dir added to PATH: $dir"

      - name: Install depot_tools (PowerShell - native Windows paths)
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          if (-not (Test-Path depot_tools/.git)) {
            git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git depot_tools
          }
          $dt = Join-Path (Get-Location).Path "depot_tools"
          Add-Content -Path $env:GITHUB_PATH -Value $dt
          Write-Host "depot_tools on PATH: $dt"
          # Bootstrap depot_tools now (downloads bundled python3/git and
          # writes python3_bin_reldir.txt that gn requires). gclient sync
          # normally triggers this, but we skip sync on warm runs - so do
          # it here, idempotently, so gn gen always finds initialized tools.
          $env:PATH = "$dt;$env:PATH"
          # gclient/*.bat print recommendation WARNINGs to stderr; under
          # -ErrorActionPreference Stop those become fatal NativeCommandErrors.
          # Relax to Continue for the native bootstrap calls and judge
          # success solely by the python3_bin_reldir.txt artifact.
          $ErrorActionPreference = "Continue"
          cmd /c "gclient --version"
          if (-not (Test-Path "$dt\python3_bin_reldir.txt")) {
            Write-Host "Forcing bootstrap via update_depot_tools.bat..."
            cmd /c "$dt\update_depot_tools.bat"
          }
          $ErrorActionPreference = "Stop"
          if (-not (Test-Path "$dt\python3_bin_reldir.txt")) {
            throw "depot_tools bootstrap failed: python3_bin_reldir.txt missing"
          }
          Write-Host "depot_tools bootstrapped (python3_bin_reldir.txt present)."

      # Chromium compiles with MSVC. If no Visual Studio C++ toolchain is
      # present, install VS 2022 Build Tools (C++ workload + Win SDK + ATL)
      # unattended. Runs BEFORE sync so a non-admin runner fails fast
      # instead of after a long sync. Warm runs (VS already there) skip it
      # instantly. gn gen later detects VS via vswhere - no runner restart.
      - name: Ensure Visual Studio C++ toolchain (auto-install if missing)
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          function Get-VSPath {
            if (Test-Path $vswhere) {
              return (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath 2>$null | Select-Object -First 1)
            }
            return $null
          }
          $inst = Get-VSPath
          if (-not $inst) {
            $isAdmin = ([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
            if (-not $isAdmin) {
              throw "VS C++ tools missing and the runner is NOT elevated, so I cannot install them. Install VS 2022 Build Tools with the 'Desktop development with C++' workload from an elevated shell, then re-run."
            }
            Write-Host "Installing VS 2022 Build Tools (C++ workload) unattended - this takes ~15-20 min..."
            $bs = Join-Path $env:TEMP "vs_buildtools.exe"
            Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vs_buildtools.exe" -OutFile $bs
            # Microsoft re-issues this bootstrapper constantly, so it cannot be
            # pinned by hash: require a valid Authenticode signature by Microsoft.
            $sig = Get-AuthenticodeSignature $bs
            if ($sig.Status -ne "Valid" -or $sig.SignerCertificate.Subject -notmatch "O=Microsoft Corporation") {
              throw "vs_buildtools.exe signature check failed: $($sig.Status) $($sig.SignerCertificate.Subject)"
            }
            $vsArgs = @(
              "--quiet","--wait","--norestart","--nocache",
              "--add","Microsoft.VisualStudio.Workload.VCTools",
              "--add","Microsoft.VisualStudio.Component.VC.Tools.x86.x64",
              "--add","Microsoft.VisualStudio.Component.Windows11SDK.26100",
              "--add","Microsoft.VisualStudio.Component.Windows11SDK.22621",
              "--add","Microsoft.VisualStudio.Component.VC.ATL",
              "--includeRecommended"
            )
            $p = Start-Process -FilePath $bs -ArgumentList $vsArgs -Wait -PassThru
            Write-Host "VS installer exit code: $($p.ExitCode)"
            if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) { throw "VS install failed ($($p.ExitCode))" }
            $inst = Get-VSPath
          }
          if (-not $inst) { throw "VS C++ tools still not detected." }
          Write-Host "VS C++ tools at: $inst"
          # vs_toolchain.py (DEPOT_TOOLS_WIN_TOOLCHAIN=0) only finds VS via
          # these env vars when it lives outside %ProgramFiles(x86)% - which
          # VS 2022 does (it installs under 64-bit %ProgramFiles%). Export
          # the vswhere-resolved path for gn gen + build.
          "vs2022_install=$inst"         | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii
          "GYP_MSVS_OVERRIDE_PATH=$inst" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii
          Write-Host "Exported vs2022_install + GYP_MSVS_OVERRIDE_PATH=$inst"

      - name: Sync Chromium source (pinned) - short root C:\cr
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          git config --global core.longpaths true
          # Best-effort: enable system-wide long paths (needs admin). If it
          # fails we still have the short C:\cr root as the real fix.
          try {
            Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
              -Name "LongPathsEnabled" -Value 1 -Type DWord -ErrorAction Stop
            Write-Host "LongPathsEnabled=1 (system-wide)"
          } catch {
            Write-Host "LongPathsEnabled not set (no admin) - short root C:\cr is the primary fix"
          }

          $root = $env:BUILD_ROOT
          $wsChromium = Join-Path $env:GITHUB_WORKSPACE "chromium"
          # Salvage a prior workspace sync (instant same-drive rename) so we
          # don't re-download ~1.3h of Chromium source.
          if ((-not (Test-Path "$root\src\.git")) -and (Test-Path "$wsChromium\src\.git") -and (-not (Test-Path $root))) {
            Write-Host "Salvaging prior workspace sync: $wsChromium -> $root"
            Move-Item -LiteralPath $wsChromium -Destination $root -Force
          }

          # If the tree is already fully synced, skip gclient sync. A prior
          # run copies MoltBrowser overlays into src AFTER sync, leaving the
          # tree 'dirty' - which makes `gclient sync` refuse ("You have
          # uncommitted changes"). Source + DEPS + hooks are already
          # complete, so we go straight to overlays -> gn gen -> build.
          # A warm tree is only reusable while it is at the CURRENT pin.
          $head = ""
          if (Test-Path "$root\src\.git") { $head = (git -C "$root\src" rev-parse HEAD) }
          if (($head -eq $env:CHROMIUM_REVISION) -and ((Test-Path "$root\.molt-synced") -or (Test-Path "$root\src\third_party\depot_tools\gclient.py"))) {
            Write-Host "C:\cr\src already synced at the pin - skipping gclient sync."
            exit 0
          }
          if ($head -and ($head -ne $env:CHROMIUM_REVISION)) {
            # The pin moved (rebase). Drop the old overlay copies (re-applied
            # below; out/ is gitignored and survives), then move src to the pin.
            Write-Host "C:\cr\src is at $head; moving it to the pin $($env:CHROMIUM_REVISION)"
            git -C "$root\src" reset -q --hard
            git -C "$root\src" clean -fdq
            git -C "$root\src" fetch --depth=1 --no-tags origin $env:CHROMIUM_REVISION
            if ($LASTEXITCODE -ne 0) { throw "git fetch of the pin failed ($LASTEXITCODE)" }
            git -C "$root\src" checkout -q --detach FETCH_HEAD
            if ($LASTEXITCODE -ne 0) { throw "git checkout of the pin failed ($LASTEXITCODE)" }
            Remove-Item -Force "$root\.molt-synced" -ErrorAction SilentlyContinue
          }
          New-Item -ItemType Directory -Force -Path $root | Out-Null

          # The prior run's gsutil self-extract failed mid-way at the long
          # path; nuke its cache so it re-bootstraps clean at the short root.
          $gs = Join-Path $root "src\third_party\depot_tools\external_bin\gsutil"
          if (Test-Path $gs) {
            Write-Host "Clearing half-extracted gsutil cache: $gs"
            Remove-Item -Recurse -Force $gs -ErrorAction SilentlyContinue
          }

          Set-Location $root
          $g = @(
            'solutions = ['
            '  {'
            '    "name": "src",'
            '    "url": "https://chromium.googlesource.com/chromium/src.git",'
            '    "custom_deps": {},'
            '    "custom_vars": {},'
            '  },'
            ']'
            "target_os = ['win']"
          )
          $g | Set-Content -Path .gclient -Encoding ascii
          if (-not (Test-Path src/.git)) {
            New-Item -ItemType Directory -Force -Path src | Out-Null
            Set-Location src
            git init -q
            git remote add origin https://chromium.googlesource.com/chromium/src.git
            git fetch --depth=1 --no-tags origin $env:CHROMIUM_REVISION
            git checkout --detach FETCH_HEAD
            Set-Location ..
          }
          & gclient sync --revision "src@$($env:CHROMIUM_REVISION)" --no-history --shallow
          if ($LASTEXITCODE -ne 0) { throw "gclient sync failed ($LASTEXITCODE)" }
          if ((git -C "$root\src" rev-parse HEAD) -ne $env:CHROMIUM_REVISION) { throw "C:\cr\src is not at the pin after sync" }
          $env:CHROMIUM_REVISION | Set-Content -Path "$root\.molt-synced" -Encoding ascii
          Write-Host "Sync complete - wrote .molt-synced sentinel."

      - name: Copy MoltBrowser overlays
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          # Merge the repo's src/* overlay into C:\cr\src (robocopy merges
          # cleanly; exit codes 0-7 are success, 8+ are errors).
          robocopy "$env:GITHUB_WORKSPACE\src" "$env:BUILD_ROOT\src" /E /NFL /NDL /NJH /NJS /NP
          if ($LASTEXITCODE -ge 8) { throw "robocopy failed ($LASTEXITCODE)" }
          exit 0

      - name: Configure (gn gen)
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location "$env:BUILD_ROOT\src"
          # One-time clean: a hard reboot during a prior compile left the siso
          # build state corrupted (thousands of fs errors, failure at target
          # ~130 on code that compiled fine pre-reboot). Wipe the output dir
          # once so we build from a clean, consistent state. Future runs skip
          # this (sentinel present) and resume incrementally.
          $cleanSentinel = Join-Path $env:BUILD_ROOT ".molt-clean-v1"
          if (-not (Test-Path $cleanSentinel)) {
            if (Test-Path out/MoltBrowser) {
              Write-Host "One-time clean of corrupted build state: out/MoltBrowser"
              Remove-Item -Recurse -Force out/MoltBrowser -ErrorAction SilentlyContinue
            }
            New-Item -ItemType File -Force -Path $cleanSentinel | Out-Null
          }
          New-Item -ItemType Directory -Force -Path out/MoltBrowser | Out-Null
          Copy-Item "$env:GITHUB_WORKSPACE\configs\windows-x64.gn" out/MoltBrowser/args.gn -Force
          Get-Content out/MoltBrowser/args.gn
          & gn gen out/MoltBrowser
          if ($LASTEXITCODE -ne 0) { throw "gn gen failed ($LASTEXITCODE)" }

      - name: Build chrome (full, no cap)
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          # Keep the PC awake for the multi-hour compile. A prior build died
          # when the machine idle-slept ("runner lost communication"). This
          # holds ES_SYSTEM_REQUIRED for the life of THIS powershell process
          # (which stays alive running autoninja), so no idle sleep. It
          # auto-clears when the step ends - no persistent power-config change.
          Add-Type -Namespace Win32 -Name Power -MemberDefinition '[DllImport("kernel32.dll", SetLastError=true)] public static extern uint SetThreadExecutionState(uint esFlags);'
          # ES_CONTINUOUS(0x80000000)|ES_SYSTEM_REQUIRED(0x1)|ES_AWAYMODE_REQUIRED(0x40)=2147483713
          [void][Win32.Power]::SetThreadExecutionState(2147483713)
          Write-Host "Sleep inhibited for the duration of the build."
          Set-Location "$env:BUILD_ROOT\src"
          # Thermal headroom: this runs on a laptop that overheated and froze
          # at full load. Cap parallelism to half the logical processors so
          # the CPU isn't pegged at 100% for hours. Slower but won't cook the
          # machine. (Override with MOLT_NINJA_JOBS if needed.)
          $cores = [Environment]::ProcessorCount
          # Lowered from cores/2 to cores/4: at -j6 siso advanced at only
          # ~0.29x wall-time = severe RAM-swap thrashing (too many heavy
          # Blink/V8 compiles for available RAM). Fewer parallel jobs fit in
          # RAM, eliminate swapping, and raise real throughput. Tune via
          # MOLT_NINJA_JOBS if needed.
          if ($env:MOLT_NINJA_JOBS) { $jobs = [int]$env:MOLT_NINJA_JOBS }
          else { $jobs = [Math]::Max(2, [Math]::Floor($cores / 4)) }
          Write-Host "Logical processors: $cores -> building with -j $jobs (RAM-thrash mitigation)"
          # autoninja (not plain ninja) - the out dir was initialized by siso;
          # autoninja picks the right tool and forwards -j to cap concurrency,
          # preserving the incremental build while limiting heat.
          & autoninja -C out/MoltBrowser -j $jobs chrome
          $buildCode = $LASTEXITCODE
          if ($buildCode -ne 0) {
            Write-Host "===== siso_output (tail 120) ====="
            if (Test-Path out/MoltBrowser/siso_output) { Get-Content out/MoltBrowser/siso_output -Tail 120 }
            Write-Host "===== siso_failed_commands.bat ====="
            if (Test-Path out/MoltBrowser/siso_failed_commands.bat) { Get-Content out/MoltBrowser/siso_failed_commands.bat }
            throw "build failed ($buildCode)"
          }
          if (-not (Test-Path out/MoltBrowser/chrome.exe)) { throw "chrome.exe missing after build" }
          Write-Host "chrome.exe built"

      - name: Stage portable zip
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location "$env:BUILD_ROOT\src\out\MoltBrowser"
          # Bundle the runtime files (exe + dlls + resources + locales),
          # excluding build intermediates (obj/, gen/, *.lib, *.pdb).
          $items = Get-ChildItem -File | Where-Object {
            $_.Extension -in '.exe','.dll','.pak','.bin','.dat','.json' -or $_.Name -like '*.dll.*'
          }
          $stage = "MoltBrowser-Windows-x64"
          if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          $items | ForEach-Object { Copy-Item $_.FullName $stage/ -Force }
          if (Test-Path locales)   { Copy-Item locales   $stage/locales   -Recurse -Force }
          if (Test-Path resources) { Copy-Item resources $stage/resources -Recurse -Force }

          # ---- Bundle runtime binaries: Tor / Tesseract OCR / whisper.cpp ----
          # Makes MoltNet (Tor), OCR, and voice transcription functional on
          # Windows. The app resolves them next to the exe at runtime:
          #   <DIR_EXE>\tor\tor.exe          (+ geoip, geoip6)
          #   <DIR_EXE>\ocr\tesseract.exe    (+ *.dll, tessdata\eng.traineddata)
          #   <DIR_EXE>\whisper\whisper-cli.exe (+ dlls, ggml-tiny.en.bin)
          # Every download is pinned by SHA-256 and every failure is FATAL: a
          # release never ships an unverified or silently missing component.
          # Downloads cache in $env:TEMP across runs and are re-verified on
          # every use. PS5.1 needs TLS1.2 forced or all the Invoke-WebRequest
          # calls fail on a stock runner. ASCII only.
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $ProgressPreference = "SilentlyContinue"
          $dl = $env:TEMP

          # SHA-256 pins. An empty value is a PLACEHOLDER (the host was not
          # reachable when these were pinned on 2026-10-14) and fails the run
          # until someone verifies the file and fills it in.
          $pins = @{
            "7zr-24.08"           = "1b16c41ae39b679384b06f1492b587b650716430ff9c2e079dca2ad1f62c952d"
            "7z2408-x64"          = "67cb9d3452c9dd974b04f4a5fd842dbcba8184f2344ff72e3662d7cdb68b099b"
            # PLACEHOLDER: take it from sha256sums-signed-build.txt of Tor
            # Browser 15.0.15 on archive.torproject.org after verifying that
            # file's signature with the Tor Browser signing key.
            "tor-15.0.15"         = ""
            "tesseract-5.4.0.20240606" = "c885fff6998e0608ba4bb8ab51436e1c6775c2bafc2559a19b423e18678b60c9"
            "whisper-bin-x64-v1.9.1"   = "7d8be46ecd31828e1eb7a2ecdd0d6b314feafd82163038ab6092594b0a063539"
            # PLACEHOLDER: same value as EXPECTED_SHA256_WHISPER_TINY_EN in
            # scripts/bundle-whisper.sh (see the instructions there).
            "ggml-tiny.en.bin"    = ""
          }

          # Download $url to $out unless a cached copy already matches $sha256.
          # A missing pin or a mismatch throws (and deletes the bad file).
          function Get-Pinned([string]$url, [string]$out, [string]$sha256) {
            if (-not $sha256) { throw "No SHA-256 pinned for $url - verify the file and pin it in this workflow." }
            if ((Test-Path $out) -and ((Get-FileHash $out -Algorithm SHA256).Hash -ne $sha256)) {
              Write-Host "Cached $out does not match its pin; downloading again."
              Remove-Item -Force $out
            }
            if (-not (Test-Path $out)) {
              Invoke-WebRequest -Uri $url -OutFile "$out.part" -UseBasicParsing -TimeoutSec 900
              Move-Item -Force "$out.part" $out
            }
            $h = (Get-FileHash $out -Algorithm SHA256).Hash
            if ($h -ne $sha256) {
              Remove-Item -Force $out
              throw "SHA-256 mismatch for $url : expected $sha256, got $h"
            }
            Write-Host "Verified $out ($h)"
          }

          # Provision a full 7z.exe up front (no admin, no winget): 7zr.exe is a
          # standalone .7z extractor and the 7-Zip installer is itself a 7z SFX,
          # so 7zr unpacks it to yield 7z.exe + 7z.dll. Used both to extract the
          # Tesseract NSIS installer AND to build a spec-compliant forward-slash
          # zip (the .NET ZipFile in PS5.1/.NET Framework writes BACKSLASH entry
          # names, which some Windows extractors mishandle). Versioned URLs from
          # 7-Zip's official GitHub releases (www.7-zip.org/a/7zr.exe is not
          # versioned, so it cannot be pinned). Re-extracted from the verified
          # installer on every run, so a tampered cached 7z.exe is never used.
          $sevenZip = "$env:ProgramFiles\7-Zip\7z.exe"
          if (-not (Test-Path $sevenZip)) {
            $szDir = Join-Path $dl "7zip-24.08"
            $sevenZip = Join-Path $szDir "7z.exe"
            $zr = Join-Path $dl "7zr-24.08.exe"
            Get-Pinned "https://github.com/ip7z/7zip/releases/download/24.08/7zr.exe" $zr $pins["7zr-24.08"]
            $zi = Join-Path $dl "7z2408-x64.exe"
            Get-Pinned "https://github.com/ip7z/7zip/releases/download/24.08/7z2408-x64.exe" $zi $pins["7z2408-x64"]
            if (Test-Path $szDir) { Remove-Item -Recurse -Force $szDir }
            & $zr x $zi "-o$szDir" -y -bso0 -bsp0 | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "7zr could not unpack 7-Zip ($LASTEXITCODE)" }
            if (-not (Test-Path $sevenZip)) { throw "7-Zip provisioning failed: $sevenZip missing" }
          }
          $have7z = $true
          Write-Host "7-Zip: $sevenZip"

          # Tor Expert Bundle - tor.exe is statically linked (no DLLs); the
          # geoip databases live under data\ inside the tarball. tar is native.
          $torVer = "15.0.15"
          $torUrl = "https://archive.torproject.org/tor-package-archive/torbrowser/$torVer/tor-expert-bundle-windows-x86_64-$torVer.tar.gz"
          $torTgz = Join-Path $dl "tor-eb-$torVer.tar.gz"
          $torEx  = Join-Path $dl "tor-eb-$torVer"
          Get-Pinned $torUrl $torTgz $pins["tor-$torVer"]
          if (Test-Path $torEx) { Remove-Item $torEx -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $torEx | Out-Null
          tar -xzf $torTgz -C $torEx
          if ($LASTEXITCODE -ne 0) { throw "tar failed ($LASTEXITCODE)" }
          $torDst = Join-Path $stage "tor"
          New-Item -ItemType Directory -Force -Path $torDst | Out-Null
          Copy-Item (Join-Path $torEx "tor\tor.exe")         $torDst -Force
          Copy-Item (Join-Path $torEx "tor\tor-gencert.exe") $torDst -Force
          Copy-Item (Join-Path $torEx "data\geoip")          $torDst -Force
          Copy-Item (Join-Path $torEx "data\geoip6")         $torDst -Force
          Write-Host "Bundled Tor $torVer into tor\"

          # Tesseract OCR - UB-Mannheim ships only an NSIS installer; 7-Zip
          # silent-extracts it. Copy tesseract.exe + ALL dlls (transitive
          # closure is version-fragile) + eng/osd traineddata.
          $tessVer = "5.4.0.20240606"
          $tessUrl = "https://github.com/UB-Mannheim/tesseract/releases/download/v$tessVer/tesseract-ocr-w64-setup-$tessVer.exe"
          $tessExe = Join-Path $dl "tesseract-$tessVer.exe"
          $tessEx  = Join-Path $dl "tesseract-$tessVer"
          Get-Pinned $tessUrl $tessExe $pins["tesseract-$tessVer"]
          if (Test-Path $tessEx) { Remove-Item $tessEx -Recurse -Force }
          & $sevenZip x $tessExe "-o$tessEx" -y -bso0 -bsp0 | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "7z failed ($LASTEXITCODE)" }
          $ocrDst = Join-Path $stage "ocr"
          New-Item -ItemType Directory -Force -Path $ocrDst | Out-Null
          Copy-Item (Join-Path $tessEx "tesseract.exe") $ocrDst -Force
          Copy-Item (Join-Path $tessEx "*.dll")         $ocrDst -Force
          $tdDst = Join-Path $ocrDst "tessdata"
          New-Item -ItemType Directory -Force -Path $tdDst | Out-Null
          Copy-Item (Join-Path $tessEx "tessdata\eng.traineddata") $tdDst -Force
          if (Test-Path (Join-Path $tessEx "tessdata\osd.traineddata")) { Copy-Item (Join-Path $tessEx "tessdata\osd.traineddata") $tdDst -Force }
          Write-Host "Bundled Tesseract $tessVer into ocr\"

          # whisper.cpp - plain CPU build (portable across x64; no BLAS/CUDA
          # runtimes). Modern CLI is whisper-cli.exe (main.exe is a deprecated
          # stub). Model from HuggingFace. Files sit under Release\ in the zip.
          $whVer = "v1.9.1"
          $whUrl = "https://github.com/ggml-org/whisper.cpp/releases/download/$whVer/whisper-bin-x64.zip"
          $whZip = Join-Path $dl "whisper-$whVer.zip"
          $whEx  = Join-Path $dl "whisper-$whVer"
          Get-Pinned $whUrl $whZip $pins["whisper-bin-x64-$whVer"]
          if (Test-Path $whEx) { Remove-Item $whEx -Recurse -Force }
          Expand-Archive -Path $whZip -DestinationPath $whEx -Force
          $rel = Join-Path $whEx "Release"
          if (-not (Test-Path $rel)) { $rel = $whEx }
          $whDst = Join-Path $stage "whisper"
          New-Item -ItemType Directory -Force -Path $whDst | Out-Null
          Copy-Item (Join-Path $rel "whisper-cli.exe") $whDst -Force
          Copy-Item (Join-Path $rel "whisper.dll")     $whDst -Force
          Copy-Item (Join-Path $rel "ggml.dll")        $whDst -Force
          Copy-Item (Join-Path $rel "ggml-base.dll")   $whDst -Force
          Copy-Item (Join-Path $rel "ggml-cpu-*.dll")  $whDst -Force
          $whModelDl = Join-Path $dl "ggml-tiny.en.bin"
          Get-Pinned "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.en.bin" $whModelDl $pins["ggml-tiny.en.bin"]
          Copy-Item $whModelDl (Join-Path $whDst "ggml-tiny.en.bin") -Force
          Write-Host "Bundled whisper.cpp $whVer + tiny.en into whisper\"

          $zip = Join-Path $env:GITHUB_WORKSPACE "MoltBrowser-Windows-x64.zip"
          if (Test-Path $zip) { Remove-Item -Force $zip }
          # Prefer 7-Zip: fast AND writes spec-compliant forward-slash entries
          # (so tor/ ocr/ whisper/ extract as real subfolders the app resolves
          # at runtime). "$stage\*" stores entries relative to the staged dir
          # (contents at the zip root). Fall back to .NET ZipFile only if 7z is
          # unavailable (that path writes backslash entries - last resort).
          if ($have7z) {
            & $sevenZip a -tzip -mx=3 -bso0 -bsp0 $zip "$stage\*" | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "7z zip failed ($LASTEXITCODE)" }
          } else {
            Add-Type -AssemblyName System.IO.Compression.FileSystem
            [System.IO.Compression.ZipFile]::CreateFromDirectory((Resolve-Path $stage).Path, $zip)
          }
          Get-Item $zip | Format-List Name,Length
          # Every native call above checks its own exit code and cmdlet errors
          # throw under EAP=Stop, so reaching here means success; exit 0 keeps
          # GitHub's appended "exit $LASTEXITCODE" from failing the step on a
          # stale nonzero code.
          exit 0

      # Upload the portable zip immediately, decoupled from the (slower) NSIS
      # installer, so functional Windows is live the moment staging completes
      # and is never blocked by installer compression time.
      - name: Upload portable zip to the DRAFT release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          tag_name: ${{ inputs.tag }}
          # A release this creates stays a draft until the offline-signed
          # molt-release-manifest.json + .sig are attached (see release.yml).
          draft: true
          files: MoltBrowser-Windows-x64.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Build the NSIS setup installer from the SAME staged dir the portable
      # zip used (C:\cr\src\out\MoltBrowser\MoltBrowser-Windows-x64). Output
      # MoltBrowser-Windows-x64-Setup.exe into the workspace root, next to
      # the zip. Uses an installed makensis, else a SHA-256-pinned portable
      # NSIS; if neither works the run FAILS (no silently missing installer).
      #
      # NOTE: pure-ASCII body. Windows PowerShell 5.1 reads this BOM-less
      # script as CP1252; a stray em-dash/smart-quote becomes a fatal parse
      # error. Keep it plain ASCII.
      - name: Build NSIS setup installer
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $stageDir = Join-Path $env:BUILD_ROOT "src\out\MoltBrowser\MoltBrowser-Windows-x64"
          if (-not (Test-Path $stageDir)) { throw "Staged dir not found: $stageDir" }

          $version = $env:RELEASE_TAG.TrimStart("v")
          if (-not $version) { $version = "0.0.0" }

          $outFile = Join-Path $env:GITHUB_WORKSPACE "MoltBrowser-Windows-x64-Setup.exe"
          $nsi     = Join-Path $env:GITHUB_WORKSPACE "installer\windows\moltbrowser.nsi"
          if (-not (Test-Path $nsi)) { throw "NSIS script not found: $nsi" }

          # ---- Locate makensis.exe (PATH, then standard NSIS install dirs) ----
          function Find-MakeNSIS {
            $cmd = Get-Command makensis -ErrorAction SilentlyContinue
            if ($cmd) { return $cmd.Source }
            $cands = @(
              "${env:ProgramFiles(x86)}\NSIS\makensis.exe",
              "$env:ProgramFiles\NSIS\makensis.exe"
            )
            foreach ($c in $cands) { if (Test-Path $c) { return $c } }
            return $null
          }

          $makensis = Find-MakeNSIS

          # ---- If missing, fetch portable NSIS directly (below) ----
          # NOTE: deliberately NOT trying "winget install NSIS.NSIS" here - it
          # hangs for hours non-interactively on this runner (no console for the
          # source/package agreement prompts), which previously made this step
          # take ~4h. The direct portable-zip download below is fast + reliable.

          if (-not $makensis) {
            Write-Host "makensis not found; downloading portable NSIS..."
            try {
              [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
              $ProgressPreference = "SilentlyContinue"
              # Reuse the portable 7z the Stage step provisioned (same job/TEMP);
              # the SourceForge zip can come back as an HTML interstitial that
              # Expand-Archive rejects; the SHA-256 pin below catches that too.
              $sz = "$env:TEMP\7zip-24.08\7z.exe"
              if (-not (Test-Path $sz)) { $sz = "$env:ProgramFiles\7-Zip\7z.exe" }
              $nsisVer = "3.10"
              $tmpZip = Join-Path $env:TEMP "nsis-$nsisVer.zip"
              $dest   = Join-Path $env:TEMP "nsis-$nsisVer"
              # master.dl.sourceforge.net serves files DIRECTLY (no "download
              # will start shortly" HTML interstitial that broke the others).
              # Browser UA + hard TimeoutSec so a stalled mirror fails in
              # minutes, never hangs the step for hours.
              $urls = @(
                "https://master.dl.sourceforge.net/project/nsis/NSIS%203/$nsisVer/nsis-$nsisVer.zip?viasf=1",
                "https://downloads.sourceforge.net/project/nsis/NSIS%203/$nsisVer/nsis-$nsisVer.zip",
                "https://sourceforge.net/projects/nsis/files/NSIS%203/$nsisVer/nsis-$nsisVer.zip/download"
              )
              $ua = "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"
              # SHA-256 of nsis-3.10.zip (all mirrors serve the same file).
              $nsisSha256 = "fcdce3229717a2a148e7cda0ab5bdb667f39d8fb33ede1da8dabc336bd5ad110"
              $ok = (Test-Path $tmpZip) -and ((Get-FileHash $tmpZip -Algorithm SHA256).Hash -eq $nsisSha256)
              if (-not $ok) {
                foreach ($u in $urls) {
                  if (Test-Path $tmpZip) { Remove-Item -Force $tmpZip }
                  try { Invoke-WebRequest -Uri $u -OutFile $tmpZip -UseBasicParsing -MaximumRedirection 10 -UserAgent $ua -TimeoutSec 300 } catch { Write-Host "  NSIS url failed: $u"; continue }
                  $h = (Get-FileHash $tmpZip -Algorithm SHA256).Hash
                  if ($h -eq $nsisSha256) { Write-Host "  NSIS from: $u (verified)"; $ok = $true; break }
                  Write-Host "  NSIS from $u has SHA-256 $h, not the pin - ignored"
                }
              }
              if (-not $ok) {
                if (Test-Path $tmpZip) { Remove-Item -Force $tmpZip }
                throw "no mirror served nsis-$nsisVer.zip matching its SHA-256 pin"
              }
              if (Test-Path $dest) { Remove-Item -Recurse -Force $dest }
              if (Test-Path $sz) {
                & $sz x $tmpZip "-o$dest" -y -bso0 -bsp0 | Out-Null
                if ($LASTEXITCODE -ne 0) { throw "7z could not extract NSIS ($LASTEXITCODE)" }
              }
              else { Expand-Archive -Path $tmpZip -DestinationPath $dest -Force }
              $found = Get-ChildItem -Path $dest -Recurse -Filter makensis.exe -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($found) { $makensis = $found.FullName }
            } catch {
              throw "NSIS download/extract failed: $($_.Exception.Message)"
            }
          }

          if (-not $makensis) {
            throw "NSIS (makensis) unavailable. Install NSIS on the runner (winget install NSIS.NSIS) or fix the pinned download above."
          }

          Write-Host "Using makensis: $makensis"
          Write-Host "Stage dir:      $stageDir"
          Write-Host "Version:        $version"
          Write-Host "Output:         $outFile"

          if (Test-Path $outFile) { Remove-Item -Force $outFile }

          & $makensis "/DVERSION=$version" "/DSTAGE_DIR=$stageDir" "/DOUT_FILE=$outFile" $nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed ($LASTEXITCODE)" }
          if (-not (Test-Path $outFile)) { throw "Installer not produced: $outFile" }
          Get-Item $outFile | Format-List Name,Length

      - name: Upload setup installer to the DRAFT release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          tag_name: ${{ inputs.tag }}
          draft: true
          files: MoltBrowser-Windows-x64-Setup.exe
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # One SPDX SBOM per installer (docs/SBOM.md): Chromium's third-party
      # components from the checkout's licenses.py, and every file of the
      # bundled tor / OCR / whisper with its pin, from the staged folder.
      - name: SBOMs
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $src = Join-Path $env:BUILD_ROOT "src"
          $out = Join-Path $src "out\MoltBrowser"
          $stage = Join-Path $out "MoltBrowser-Windows-x64"
          $sbomArgs = @("tools\sbom\molt_sbom.py", "generate", "--platform", "windows",
            "--arch", "x64", "--version", $env:RELEASE_TAG, "--chromium-src", $src,
            "--gn-out-dir", $out, "--payload", $stage, "--release",
            "--out-dir", $env:GITHUB_WORKSPACE,
            "--artifact", "MoltBrowser-Windows-x64-Setup.exe",
            "--artifact", "MoltBrowser-Windows-x64.zip")
          & python3 @sbomArgs
          if ($LASTEXITCODE -ne 0) { throw "SBOM generation failed ($LASTEXITCODE)" }
          & python3 tools\sbom\molt_sbom.py validate `
            --artifact MoltBrowser-Windows-x64-Setup.exe --artifact MoltBrowser-Windows-x64.zip `
            MoltBrowser-Windows-x64-Setup-exe.spdx.json MoltBrowser-Windows-x64-zip.spdx.json
          if ($LASTEXITCODE -ne 0) { throw "SBOM validation failed ($LASTEXITCODE)" }

      # sha256sum-format sums for the assets (LF line endings), published
      # next to them, plus a signed build-provenance attestation.
      - name: Checksums
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $names = @("MoltBrowser-Windows-x64-Setup.exe", "MoltBrowser-Windows-x64.zip",
            "MoltBrowser-Windows-x64-Setup-exe.spdx.json", "MoltBrowser-Windows-x64-zip.spdx.json")
          $lines = foreach ($n in $names) {
            $f = Join-Path $env:GITHUB_WORKSPACE $n
            if (-not (Test-Path $f)) { throw "missing release asset: $n" }
            "{0}  {1}" -f (Get-FileHash $f -Algorithm SHA256).Hash.ToLower(), $n
          }
          $out = Join-Path $env:GITHUB_WORKSPACE "SHA256SUMS-windows-x64"
          [IO.File]::WriteAllText($out, (($lines | Sort-Object) -join "`n") + "`n")
          Get-Content $out

      - name: Build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            MoltBrowser-Windows-x64-Setup.exe
            MoltBrowser-Windows-x64.zip
            MoltBrowser-Windows-x64-Setup-exe.spdx.json
            MoltBrowser-Windows-x64-zip.spdx.json

      - name: Upload SBOMs and checksums to the DRAFT release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          tag_name: ${{ inputs.tag }}
          draft: true
          files: |
            MoltBrowser-Windows-x64-Setup-exe.spdx.json
            MoltBrowser-Windows-x64-zip.spdx.json
            SHA256SUMS-windows-x64
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

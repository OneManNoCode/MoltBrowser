name: Release Linux build

# Automated Linux x64 build pipeline. Triggers on every git tag push
# (v*) and on manual workflow_dispatch. Builds in a native Linux runner
# (no Rosetta overhead, no Mac sleep risk, no Docker quirks) and uploads
# .deb / .rpm / .tar.gz directly to the GitHub Release matching the tag.
#
# Why this exists:
# Building MoltBrowser for Linux locally on a Mac via Docker+Rosetta
# took 24-40 hours per attempt and accumulated 17 distinct fixes over a
# week (see commits c68c114 through 7aff90f). Native Linux on a real
# x86_64 runner finishes the same build in ~4 hours and never hits
# clock-skew / OOM / depot_tools-arch-mismatch issues.
#
# Resource notes:
# - GitHub-hosted ubuntu-latest: 4 cores, 16 GB RAM, 14 GB disk.
#   Chromium needs ~30-50 GB disk; we use a self-hosted runner OR a
#   larger runner OR carefully manage disk. For now we target a
#   self-hosted runner labeled `linux-chromium-builder`. To run on the
#   free github runner instead, change `runs-on:` below — but expect
#   disk-full failures unless you customize.
#
# Future Windows pipeline can clone this file as release-windows.yml,
# swap the OS and the package script.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to attach binaries to (e.g., v0.2.1)'
        required: true
        type: string
      jobs:
        description: 'Parallel compile jobs. Keep low on RAM-limited machines (laptops): each heavy C++ TU can use 5-8 GB, so 8 jobs OOMs a 16 GB box. 4 is a safe default; 2 for 8 GB.'
        required: false
        default: '4'
        type: string
      skip_build:
        description: 'Re-package the EXISTING build without re-compiling (packaging-only fixes finish in minutes). Needs a prior successful build on this runner. Leave false for real releases.'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: read

jobs:
  build-linux:
    # Default to a self-hosted runner. If you don't have one set up yet,
    # change this to `runs-on: ubuntu-latest` and accept the disk-space risk,
    # or pay for `ubuntu-latest-large` (~$0.08/min × 240 min ≈ $19/build).
    # See https://github.com/actions/runner/blob/main/docs/automate.md
    # for self-hosted runner setup. Hetzner CCX33 (~$60/mo) makes a good one.
    runs-on: [self-hosted, linux-chromium-builder]
    timeout-minutes: 480   # 8 hr ceiling
    permissions:
      contents: write       # upload assets to the release
      id-token: write       # build-provenance attestation (OIDC)
      attestations: write

    env:
      # Bundle downloads must match their pinned hashes; no dev override.
      MOLT_RELEASE_BUILD: "1"

    steps:
      - name: Check out repo (no submodules — Chromium synced separately)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
          # Preserve the gitignored chromium/ checkout AND out/ build dir between
          # runs so the self-hosted runner stays warm (incremental builds, no
          # ~30 GB re-sync each time). Default clean:true would git-clean them.
          clean: false

      # The EXACT Chromium commit our src/ overlay matches. Without it, fresh
      # runs hit stale-overlay BUILD.gn errors as upstream drifts.
      - name: Read Chromium pin (chromium_version.txt)
        run: tools/chromium/pin.sh env >> "$GITHUB_ENV"

      - name: Determine target tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          # Release tags only: vMAJOR.MINOR.PATCH with an optional -suffix.
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$TAG' is not a release tag (vX.Y.Z[-suffix])"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang lld cmake ninja-build python3 python3-pip \
            git curl wget pkg-config gperf bison flex \
            libgtk-3-dev libglib2.0-dev libnss3-dev libatk1.0-dev \
            libatk-bridge2.0-dev libcups2-dev libdrm-dev libxkbcommon-dev \
            libxcomposite-dev libxdamage-dev libxrandr-dev libgbm-dev \
            libpango1.0-dev libasound2-dev libdbus-1-dev libexpat1-dev \
            libfontconfig1-dev libfreetype-dev libnspr4-dev libpulse-dev \
            libx11-xcb-dev libxcb-dri3-dev libxext-dev libxfixes-dev \
            libxi-dev libxrender-dev libxtst-dev libvulkan-dev vulkan-tools \
            dpkg-dev rpm fakeroot zip fonts-liberation fonts-noto-color-emoji

      - name: Install depot_tools
        run: |
          # Idempotent: $HOME persists on a self-hosted runner, so only clone
          # if it isn't already there (a second run otherwise dies with
          # "destination path already exists and is not an empty directory").
          if [ ! -d "$HOME/depot_tools/.git" ]; then
            git clone --depth 1 \
              https://chromium.googlesource.com/chromium/tools/depot_tools.git \
              "$HOME/depot_tools"
          fi
          echo "$HOME/depot_tools" >> "$GITHUB_PATH"
          # Bootstrap depot_tools' python3 etc.
          ( cd "$HOME/depot_tools" && ./update_depot_tools && ./gclient --version >/dev/null 2>&1 ) || true

      - name: Sync Chromium source (~30-60 min on first run, cached on self-hosted)
        if: ${{ inputs.skip_build != 'true' }}
        env:
          DEPOT_TOOLS_UPDATE: "0"
          # CHROMIUM_REVISION comes from chromium_version.txt (step above).
        run: |
          set -x
          mkdir -p chromium && cd chromium
          cat > .gclient <<'EOF'
          solutions = [
            {
              "name": "src",
              "url": "https://chromium.googlesource.com/chromium/src.git",
              "custom_deps": {},
              "custom_vars": {},
            },
          ]
          target_os = ['linux']
          EOF
          if [ ! -d src/.git ]; then
            mkdir -p src
            (cd src && \
              git init -q && \
              git remote add origin https://chromium.googlesource.com/chromium/src.git && \
              git fetch --depth=1 --no-tags origin "${CHROMIUM_REVISION}" && \
              git checkout --detach FETCH_HEAD)
          fi
          (cd src && git log -1 --format="HEAD = %H %s") | head -1
          # On a WARM self-hosted runner, the previous run's overlay copy left
          # chromium/src dirty (modified tracked files + new untracked files), and
          # gclient sync refuses to run on a dirty tree ("You have uncommitted
          # changes"). Reset src back to the pinned revision first — the overlay is
          # re-applied in the next step. `clean -fd` (no -x) respects .gitignore,
          # so the out/ build cache survives for incremental builds. No-op on a
          # cold first run (tree is already clean).
          git -C src reset --hard -q
          git -C src clean -fdq
          gclient sync --revision "src@${CHROMIUM_REVISION}" --no-history --shallow --nohooks --force
          # Run the DEPS hooks: generates build/util/LASTCHANGE(.committime) and
          # installs the Linux sysroot + clang/rust toolchains. Without this,
          # gn gen dies at //build/timestamp.gni (LASTCHANGE.committime missing)
          # and there's no toolchain to build with. Sync used --nohooks, so we
          # run them explicitly here (idempotent; skipped work is cheap on re-runs).
          gclient runhooks

      - name: Copy MoltBrowser source overlays into chromium/src/
        if: ${{ inputs.skip_build != 'true' }}
        run: |
          # Same pattern build-linux.sh would do
          cp -r src/* chromium/src/

      - name: Configure + Build chrome (~3-4 hr on real Linux x86_64)
        if: ${{ inputs.skip_build != 'true' }}
        env:
          JOBS_INPUT: ${{ inputs.jobs }}
        run: |
          # Cap parallelism to protect RAM-limited machines. On workflow_dispatch
          # use the 'jobs' input; on tag-push (no inputs) fall back to a safe 4.
          JOBS="${JOBS_INPUT:-4}"
          if ! [[ "$JOBS" =~ ^[0-9]+$ ]]; then
            echo "::error::jobs must be a number, got '$JOBS'"
            exit 1
          fi
          echo "Building with --jobs $JOBS (nproc=$(nproc))"
          ./scripts/configure.sh --platform linux --arch x64
          ./scripts/build.sh --jobs "$JOBS"

      - name: Reuse existing build (skip_build=true — packaging-only fast path)
        if: ${{ inputs.skip_build == 'true' }}
        run: |
          # Package the binary already sitting in the warm out/ dir instead of
          # re-compiling. The overlay is already compiled INTO chrome, so we skip
          # sync/overlay/build entirely; package-linux.sh only reads out/MoltBrowser.
          BIN="chromium/src/out/MoltBrowser/chrome"
          if [ ! -f "$BIN" ]; then
            echo "::error::skip_build=true but $BIN is missing — no prior build to package."
            echo "Run the workflow once with skip_build=false (a full build) first."
            exit 1
          fi
          echo "Reusing existing build: $BIN ($(du -h "$BIN" | cut -f1))"

      - name: Package .deb + .rpm + .tar.gz
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # dist/ survives on the warm runner: drop earlier packages so a
          # stale one can never be renamed and published as this release.
          rm -f dist/MoltBrowser-Linux-x64.* dist/moltbrowser*.deb \
            dist/moltbrowser*.rpm dist/MoltBrowser-*-linux-x64.tar.gz
          ./scripts/package-linux.sh --version "$TAG"

      - name: Rename to stable asset names
        run: |
          cd dist
          # Exactly one match each, or fail (a silent miss used to upload
          # whatever an earlier run left behind).
          rename_one() {
            local matches
            mapfile -t matches < <(compgen -G "$1")
            if [ "${#matches[@]}" -ne 1 ]; then
              echo "::error::expected one '$1' in dist/, found ${#matches[@]}: ${matches[*]}"
              exit 1
            fi
            mv "${matches[0]}" "$2"
          }
          rename_one 'moltbrowser*amd64.deb'          MoltBrowser-Linux-x64.deb
          rename_one 'moltbrowser*x86_64.rpm'         MoltBrowser-Linux-x64.rpm
          rename_one 'MoltBrowser-*-linux-x64.tar.gz' MoltBrowser-Linux-x64.tar.gz
          ls -lh MoltBrowser-Linux-x64.*

      - name: Checksums
        run: |
          ./scripts/release-checksums.sh dist/SHA256SUMS-linux-x64 \
            dist/MoltBrowser-Linux-x64.deb dist/MoltBrowser-Linux-x64.rpm \
            dist/MoltBrowser-Linux-x64.tar.gz

      - name: Build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            dist/MoltBrowser-Linux-x64.deb
            dist/MoltBrowser-Linux-x64.rpm
            dist/MoltBrowser-Linux-x64.tar.gz

      - name: Upload Linux artifacts to the release (DRAFT until signed)
        # Uses the built-in GITHUB_TOKEN (permissions: contents: write above).
        # Avoids needing the `gh` CLI installed on the self-hosted runner.
        # draft: a release this creates stays a draft until the offline-signed
        # molt-release-manifest.json + .sig are attached (see release.yml).
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          draft: true
          files: |
            dist/MoltBrowser-Linux-x64.deb
            dist/MoltBrowser-Linux-x64.rpm
            dist/MoltBrowser-Linux-x64.tar.gz
            dist/SHA256SUMS-linux-x64
          fail_on_unmatched_files: true

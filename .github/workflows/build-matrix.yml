# MoltBrowser Cross-Platform Build Matrix
# Copyright 2025 GenEye AI Labs Inc.
#
# Builds MoltBrowser on all supported platforms.
# Manual only: each job fetches Chromium at chromium_version.txt via
# scripts/setup.sh, which needs far more disk/time than a standard hosted
# runner has, so it ran red on every push and PR. Fast PR checks live in
# webui-checks.yml.
#
# Platform matrix:
#   - macOS arm64 (Apple Silicon) — primary
#   - macOS x64 (Intel)
#   - Linux x64
#   - Windows x64
#   - Android arm64
#   - Android arm (32-bit)
#   - iOS arm64 (device)
#   - iOS sim-arm64 (simulator)

name: Build Matrix

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Comma-separated platforms to build (all,macos,linux,windows,android,ios)'
        default: 'all'

permissions:
  contents: read

# Cancel in-progress runs for the same branch
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  DEPOT_TOOLS_UPDATE: 0
  GN_ARGS_IMPORT: true
  # Passed to the package scripts through the environment, never spliced
  # into shell text (a branch name is attacker-controlled input).
  PKG_VERSION: ${{ github.ref_name || '0.0.0-dev' }}

jobs:
  # --- macOS ---
  macos-arm64:
    if: >
      github.event_name != 'workflow_dispatch' ||
      contains(github.event.inputs.platforms, 'all') ||
      contains(github.event.inputs.platforms, 'macos')
    runs-on: macos-14  # Apple Silicon runner
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1

      # Fetches Chromium at chromium_version.txt (never tip-of-tree),
      # syncs DEPS and applies the src/ overlay.
      - name: Fetch pinned Chromium + apply overlay
        run: |
          ./scripts/setup.sh --target-os mac
          echo "$PWD/depot_tools" >> "$GITHUB_PATH"

      - name: Configure (macOS arm64)
        run: ./scripts/configure.sh --platform macos --arch arm64

      - name: Build
        run: ./scripts/build.sh

      - name: Package DMG
        run: ./scripts/package-dmg.sh --version "$PKG_VERSION"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: MoltBrowser-macOS-arm64
          path: dist/MoltBrowser-*.dmg
          retention-days: 7

  macos-x64:
    if: >
      github.event_name != 'workflow_dispatch' ||
      contains(github.event.inputs.platforms, 'all') ||
      contains(github.event.inputs.platforms, 'macos')
    runs-on: macos-15-intel  # Intel runner (macos-13 is retired)
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      # Fetches Chromium at chromium_version.txt (never tip-of-tree),
      # syncs DEPS and applies the src/ overlay.
      - name: Fetch pinned Chromium + apply overlay
        run: |
          ./scripts/setup.sh --target-os mac
          echo "$PWD/depot_tools" >> "$GITHUB_PATH"
      - name: Configure (macOS x64)
        run: ./scripts/configure.sh --platform macos --arch x64
      - name: Build
        run: ./scripts/build.sh
      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: MoltBrowser-macOS-x64
          path: dist/MoltBrowser-*.dmg
          retention-days: 7

  # --- Linux ---
  linux-x64:
    if: >
      github.event_name != 'workflow_dispatch' ||
      contains(github.event.inputs.platforms, 'all') ||
      contains(github.event.inputs.platforms, 'linux')
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libglib2.0-dev libnss3-dev libatk1.0-dev \
            libatk-bridge2.0-dev libcups2-dev libdrm-dev libxkbcommon-dev \
            libxcomposite-dev libxdamage-dev libxrandr-dev libgbm-dev \
            libpango1.0-dev libasound2-dev libvulkan-dev

      # Fetches Chromium at chromium_version.txt (never tip-of-tree),
      # syncs DEPS and applies the src/ overlay.
      - name: Fetch pinned Chromium + apply overlay
        run: |
          ./scripts/setup.sh --target-os linux
          echo "$PWD/depot_tools" >> "$GITHUB_PATH"

      - name: Configure (Linux x64)
        run: ./scripts/configure.sh --platform linux --arch x64

      - name: Build
        run: ./scripts/build.sh

      - name: Package
        run: ./scripts/package-linux.sh --version "$PKG_VERSION" --format tar

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: MoltBrowser-Linux-x64
          path: dist/MoltBrowser-*linux*.tar.gz
          retention-days: 7

  # --- Windows ---
  windows-x64:
    if: >
      github.event_name != 'workflow_dispatch' ||
      contains(github.event.inputs.platforms, 'all') ||
      contains(github.event.inputs.platforms, 'windows')
    runs-on: windows-2022
    timeout-minutes: 480
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Setup VS toolchain
        shell: cmd
        run: |
          set DEPOT_TOOLS_WIN_TOOLCHAIN=0
          set vs2022_install=C:\Program Files\Microsoft Visual Studio\2022\Enterprise

      # Fetches Chromium at chromium_version.txt (never tip-of-tree),
      # syncs DEPS and applies the src/ overlay.
      - name: Fetch pinned Chromium + apply overlay
        shell: bash
        run: |
          ./scripts/setup.sh --target-os win
          echo "$PWD/depot_tools" >> "$GITHUB_PATH"

      - name: Configure (Windows x64)
        shell: bash
        run: ./scripts/configure.sh --platform windows --arch x64

      - name: Build
        shell: bash
        run: ./scripts/build.sh

      - name: Package
        shell: bash
        run: ./scripts/package-win.sh --version "$PKG_VERSION" --skip-installer

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: MoltBrowser-Windows-x64
          path: dist/MoltBrowser-*win*.zip
          retention-days: 7

  # --- Android ---
  android-arm64:
    if: >
      github.event_name != 'workflow_dispatch' ||
      contains(github.event.inputs.platforms, 'all') ||
      contains(github.event.inputs.platforms, 'android')
    runs-on: ubuntu-22.04
    timeout-minutes: 480
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4.9.1
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407  # v3.2.2
        with:
          api-level: 34
          ndk-version: 26.1.10909125

      # Fetches Chromium at chromium_version.txt (never tip-of-tree),
      # syncs DEPS and applies the src/ overlay.
      - name: Fetch pinned Chromium + apply overlay
        run: |
          ./scripts/setup.sh --target-os android
          echo "$PWD/depot_tools" >> "$GITHUB_PATH"

      - name: Configure (Android arm64)
        run: ./scripts/configure.sh --platform android --arch arm64

      - name: Build APK
        run: ./scripts/build.sh --platform android

      - name: Package
        run: ./scripts/package-android.sh --version "$PKG_VERSION"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: MoltBrowser-Android-arm64
          path: dist/MoltBrowser-*android*.apk
          retention-days: 7

  # --- iOS ---
  ios-arm64:
    if: >
      github.event_name != 'workflow_dispatch' ||
      contains(github.event.inputs.platforms, 'all') ||
      contains(github.event.inputs.platforms, 'ios')
    runs-on: macos-14
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      # Fetches Chromium at chromium_version.txt (never tip-of-tree),
      # syncs DEPS and applies the src/ overlay.
      - name: Fetch pinned Chromium + apply overlay
        run: |
          ./scripts/setup.sh --target-os ios
          echo "$PWD/depot_tools" >> "$GITHUB_PATH"

      - name: Configure (iOS arm64)
        run: ./scripts/configure.sh --platform ios --arch arm64

      - name: Build
        run: ./scripts/build.sh --platform ios

      - name: Package
        run: ./scripts/package-ios.sh --version "$PKG_VERSION"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: MoltBrowser-iOS-arm64
          path: dist/MoltBrowser-*ios*.ipa
          retention-days: 7

  # --- Summary ---
  build-summary:
    runs-on: ubuntu-latest
    needs: [macos-arm64, linux-x64, windows-x64, android-arm64, ios-arm64]
    if: always()
    steps:
      - name: Build Matrix Summary
        env:
          MACOS: ${{ needs.macos-arm64.result }}
          LINUX: ${{ needs.linux-x64.result }}
          WINDOWS: ${{ needs.windows-x64.result }}
          ANDROID: ${{ needs.android-arm64.result }}
          IOS: ${{ needs.ios-arm64.result }}
        run: |
          {
            echo "## MoltBrowser Build Matrix Results"
            echo ""
            echo "| Platform | Status |"
            echo "|---|---|"
            echo "| macOS arm64 | $MACOS |"
            echo "| Linux x64 | $LINUX |"
            echo "| Windows x64 | $WINDOWS |"
            echo "| Android arm64 | $ANDROID |"
            echo "| iOS arm64 | $IOS |"
          } >> "$GITHUB_STEP_SUMMARY"

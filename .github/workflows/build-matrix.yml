# MoltBrowser Cross-Platform Build Matrix
# Copyright 2025 GenEye AI Labs Inc.
#
# Builds MoltBrowser on all supported platforms.
# Triggers on pushes to main and pull requests.
#
# Platform matrix:
#   - macOS arm64 (Apple Silicon) — primary
#   - macOS x64 (Intel)
#   - Linux x64
#   - Windows x64
#   - Android arm64
#   - Android arm (32-bit)
#   - iOS arm64 (device)
#   - iOS sim-arm64 (simulator)

name: Build Matrix

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Comma-separated platforms to build (all,macos,linux,windows,android,ios)'
        default: 'all'

# Cancel in-progress runs for the same branch
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  DEPOT_TOOLS_UPDATE: 0
  GN_ARGS_IMPORT: true

jobs:
  # --- macOS ---
  macos-arm64:
    if: >
      github.event_name != 'workflow_dispatch' ||
      contains(github.event.inputs.platforms, 'all') ||
      contains(github.event.inputs.platforms, 'macos')
    runs-on: macos-14  # Apple Silicon runner
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup depot_tools
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git
          echo "$PWD/depot_tools" >> $GITHUB_PATH

      - name: Sync Chromium
        run: |
          cd chromium/src
          gclient sync --no-history --shallow

      - name: Configure (macOS arm64)
        run: ./scripts/configure.sh --platform macos --arch arm64

      - name: Build
        run: ./scripts/build.sh

      - name: Package DMG
        run: ./scripts/package-dmg.sh --version ${{ github.ref_name || '0.0.0-dev' }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoltBrowser-macOS-arm64
          path: dist/MoltBrowser-*.dmg
          retention-days: 7

  macos-x64:
    if: >
      github.event_name != 'workflow_dispatch' ||
      contains(github.event.inputs.platforms, 'all') ||
      contains(github.event.inputs.platforms, 'macos')
    runs-on: macos-13  # Intel runner
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Setup depot_tools
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git
          echo "$PWD/depot_tools" >> $GITHUB_PATH
      - name: Sync Chromium
        run: cd chromium/src && gclient sync --no-history --shallow
      - name: Configure (macOS x64)
        run: ./scripts/configure.sh --platform macos --arch x64
      - name: Build
        run: ./scripts/build.sh
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoltBrowser-macOS-x64
          path: dist/MoltBrowser-*.dmg
          retention-days: 7

  # --- Linux ---
  linux-x64:
    if: >
      github.event_name != 'workflow_dispatch' ||
      contains(github.event.inputs.platforms, 'all') ||
      contains(github.event.inputs.platforms, 'linux')
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libglib2.0-dev libnss3-dev libatk1.0-dev \
            libatk-bridge2.0-dev libcups2-dev libdrm-dev libxkbcommon-dev \
            libxcomposite-dev libxdamage-dev libxrandr-dev libgbm-dev \
            libpango1.0-dev libasound2-dev libvulkan-dev

      - name: Setup depot_tools
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git
          echo "$PWD/depot_tools" >> $GITHUB_PATH

      - name: Sync Chromium
        run: cd chromium/src && gclient sync --no-history --shallow

      - name: Configure (Linux x64)
        run: ./scripts/configure.sh --platform linux --arch x64

      - name: Build
        run: ./scripts/build.sh

      - name: Package
        run: ./scripts/package-linux.sh --version ${{ github.ref_name || '0.0.0-dev' }} --format tar

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoltBrowser-Linux-x64
          path: dist/MoltBrowser-*linux*.tar.gz
          retention-days: 7

  # --- Windows ---
  windows-x64:
    if: >
      github.event_name != 'workflow_dispatch' ||
      contains(github.event.inputs.platforms, 'all') ||
      contains(github.event.inputs.platforms, 'windows')
    runs-on: windows-2022
    timeout-minutes: 480
    steps:
      - uses: actions/checkout@v4

      - name: Setup depot_tools
        shell: bash
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git
          echo "$PWD/depot_tools" >> $GITHUB_PATH

      - name: Setup VS toolchain
        shell: cmd
        run: |
          set DEPOT_TOOLS_WIN_TOOLCHAIN=0
          set vs2022_install=C:\Program Files\Microsoft Visual Studio\2022\Enterprise

      - name: Sync Chromium
        shell: bash
        run: cd chromium/src && gclient sync --no-history --shallow

      - name: Configure (Windows x64)
        shell: bash
        run: ./scripts/configure.sh --platform windows --arch x64

      - name: Build
        shell: bash
        run: ./scripts/build.sh

      - name: Package
        shell: bash
        run: ./scripts/package-win.sh --version ${{ github.ref_name || '0.0.0-dev' }} --skip-installer

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoltBrowser-Windows-x64
          path: dist/MoltBrowser-*win*.zip
          retention-days: 7

  # --- Android ---
  android-arm64:
    if: >
      github.event_name != 'workflow_dispatch' ||
      contains(github.event.inputs.platforms, 'all') ||
      contains(github.event.inputs.platforms, 'android')
    runs-on: ubuntu-22.04
    timeout-minutes: 480
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk-version: 26.1.10909125

      - name: Setup depot_tools
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git
          echo "$PWD/depot_tools" >> $GITHUB_PATH

      - name: Sync Chromium
        run: cd chromium/src && gclient sync --no-history --shallow

      - name: Configure (Android arm64)
        run: ./scripts/configure.sh --platform android --arch arm64

      - name: Build APK
        run: ./scripts/build.sh --platform android

      - name: Package
        run: ./scripts/package-android.sh --version ${{ github.ref_name || '0.0.0-dev' }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoltBrowser-Android-arm64
          path: dist/MoltBrowser-*android*.apk
          retention-days: 7

  # --- iOS ---
  ios-arm64:
    if: >
      github.event_name != 'workflow_dispatch' ||
      contains(github.event.inputs.platforms, 'all') ||
      contains(github.event.inputs.platforms, 'ios')
    runs-on: macos-14
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Setup depot_tools
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git
          echo "$PWD/depot_tools" >> $GITHUB_PATH

      - name: Sync Chromium
        run: cd chromium/src && gclient sync --no-history --shallow

      - name: Configure (iOS arm64)
        run: ./scripts/configure.sh --platform ios --arch arm64

      - name: Build
        run: ./scripts/build.sh --platform ios

      - name: Package
        run: ./scripts/package-ios.sh --version ${{ github.ref_name || '0.0.0-dev' }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoltBrowser-iOS-arm64
          path: dist/MoltBrowser-*ios*.ipa
          retention-days: 7

  # --- Summary ---
  build-summary:
    runs-on: ubuntu-latest
    needs: [macos-arm64, linux-x64, windows-x64, android-arm64, ios-arm64]
    if: always()
    steps:
      - name: Build Matrix Summary
        run: |
          echo "## MoltBrowser Build Matrix Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| macOS arm64 | ${{ needs.macos-arm64.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Linux x64 | ${{ needs.linux-x64.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Windows x64 | ${{ needs.windows-x64.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Android arm64 | ${{ needs.android-arm64.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| iOS arm64 | ${{ needs.ios-arm64.result }} |" >> $GITHUB_STEP_SUMMARY

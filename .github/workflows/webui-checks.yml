name: WebUI checks

# Fast checks that need no Chromium checkout, so they can run on every
# push and pull request on a GitHub-hosted runner:
#   * every script embedded in the molt:// WebUI C++ sources parses
#   * the AI chat markdown renderer only ever emits its own safe markup
#     (security regression test, fuzzed with an HTML5 parser)

on:
  push:
    branches: [main]
    paths:
      - 'src/chrome/browser/ui/webui/molt_ai/**'
      - 'src/chrome/browser/molt_ai/**'
      - 'src/chrome/browser/ui/views/toolbar/**'
      - 'tools/webui_checks/**'
      - '.github/workflows/webui-checks.yml'
  pull_request:
    paths:
      - 'src/chrome/browser/ui/webui/molt_ai/**'
      - 'src/chrome/browser/molt_ai/**'
      - 'src/chrome/browser/ui/views/toolbar/**'
      - 'tools/webui_checks/**'
      - '.github/workflows/webui-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  webui-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '22'
      - name: Embedded scripts parse
        run: python3 tools/webui_checks/check_embedded_js.py .
      - name: Markdown renderer only emits safe markup
        working-directory: tools/webui_checks
        run: |
          npm install --no-audit --no-fund
          npm test

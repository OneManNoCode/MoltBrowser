name: WebUI checks

# Fast checks that need no Chromium checkout, so they can run on every
# push and pull request on a GitHub-hosted runner:
#   * every script embedded in the molt:// WebUI C++ sources parses,
#     including each page's /app.js as served
#   * no molt:// page needs 'unsafe-inline' again: no inline handlers or
#     inline <script>, and HTML sinks only via the Trusted Types policy
#   * the AI chat markdown renderers only ever emit their own safe markup
#     (security regression test, fuzzed with an HTML5 parser)
#   * every converted page loads in jsdom under the strict CSP with
#     Trusted Types emulated, and its controls are wired
#   * MoltShield's page scripts behave: the procedural cosmetic filter
#     engine (renderer) and the consent killer, in jsdom

on:
  push:
    branches: [main]
    paths:
      - 'src/chrome/browser/ui/webui/molt_ai/**'
      - 'src/chrome/browser/molt_ai/**'
      - 'src/chrome/renderer/molt_ai/**'
      - 'src/chrome/browser/ui/views/toolbar/**'
      - 'tools/webui_checks/**'
      - 'tools/shield_bench/*.js'
      - '.github/workflows/webui-checks.yml'
  pull_request:
    paths:
      - 'src/chrome/browser/ui/webui/molt_ai/**'
      - 'src/chrome/browser/molt_ai/**'
      - 'src/chrome/renderer/molt_ai/**'
      - 'src/chrome/browser/ui/views/toolbar/**'
      - 'tools/webui_checks/**'
      - 'tools/shield_bench/*.js'
      - '.github/workflows/webui-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  webui-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '22'
      - name: Embedded scripts parse
        run: python3 tools/webui_checks/check_embedded_js.py .
      - name: No inline handlers / scripts in molt WebUI pages
        run: python3 tools/webui_checks/check_no_inline_handlers.py .
      - name: Markdown renderers emit only safe markup; pages load under strict CSP
        working-directory: tools/webui_checks
        run: |
          npm ci --no-audit --no-fund
          npm test
      - name: MoltShield page scripts (procedural filters, consent killer) in jsdom
        run: |
          node tools/shield_bench/procedural_filters_test.js
          node tools/shield_bench/consent_killer_test.js

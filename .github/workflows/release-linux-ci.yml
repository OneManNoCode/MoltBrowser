# Free-runner Linux x64 CI probe for MoltBrowser (a Chromium fork)
# Copyright 2025 GenEye AI Labs Inc.
#
# GOAL
# ----
# Prove out (or disprove) a *pure-$0* Linux x86-64 build on GitHub's FREE
# `ubuntu-latest` runners, so milestone cross-platform builds no longer need
# the ~28 h Rosetta build on the Mac and no machine has to be bought.
#
# The repo is PUBLIC, so Actions minutes are free and unlimited on native
# x86-64 Linux runners (no Rosetta). This workflow TESTS the two hard walls
# instead of just reasoning about them, and prints df -h / ninja progress so
# the run itself yields the verdict.
#
# WHAT WE ACTUALLY OBSERVED ON THE RUNNER (run 28684969340, 2026-07-03)
# --------------------------------------------------------------------
# The disk premise everyone repeats ("~14 GB free on /, big /mnt scratch") is
# STALE for GitHub's current OSS runners. Real measured layout:
#   * 4 vCPU, 15 GiB RAM + 3 GiB swap.
#   * `/dev/root` = 145 GB total, **89 GB free** at baseline; **115 GB free**
#     after jlumbroso/free-disk-space (reclaims ~26 GiB: Android 10, .NET 5.1,
#     Haskell 3.6, tool-cache 5.2, Docker 1.9).
#   * There is NO separate large `/mnt` volume — `df /mnt` resolves to the
#     same `/dev/root`. So we do NOT relocate anything; we build right in the
#     workspace on the 115 GB root disk.
# Chromium officially needs 100 GB and realistically ~65-90 GB (checkout +
# out/). 115 GB free clears that — so DISK is *not* the wall on this runner.
# The real wall is TIME: a cold Chromium `chrome` build on 4 vCPU is ~6-13 h,
# and every public-repo job is hard-capped at **6 hours**.
#
# So this stays a PROBE, not the shipping pipeline. It uses a faster
# is_component_build=true config and bounds autoninja to a time budget, then
# reports how many ninja steps completed (X / N) so we measure the real
# compile-rate ceiling and can project whether any single 6 h job could ever
# finish. See the branch/PR report for the verdict + ranked recommendation.
#
# Triggering: pushing `ci/free-linux-build` runs it; also workflow_dispatch.
# It does NOT need to live on `main`. Read-only — uploads no release assets.

name: CI probe - free-runner Linux x64

on:
  push:
    branches:
      - ci/free-linux-build
  workflow_dispatch:
    inputs:
      component_build:
        description: 'is_component_build=true (faster/lower-RAM probe). false = official build.'
        type: boolean
        default: true
      build_budget_min:
        description: 'Minutes to let autoninja run before we stop and report X/N progress.'
        type: string
        default: '180'

permissions:
  contents: read

concurrency:
  group: ci-free-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe-free-linux:
    runs-on: ubuntu-latest
    # Public-repo hard cap is 6 h/job. We stay just under it; the ninja budget
    # (default 180 min) ends the compile phase well before this ceiling so the
    # progress-report step always runs.
    timeout-minutes: 350

    env:
      # Pin to the EXACT Chromium commit our src/ overlay matches, identical to
      # release-linux.yml. Without it, fresh CI hits stale-overlay BUILD.gn
      # errors as upstream Chromium drifts. Update on rebase.
      CHROMIUM_REVISION: "51a413be46f7632ebc3ae331c68af71daa5d6bbf"
      DEPOT_TOOLS_UPDATE: "0"

    steps:
      # ----------------------------------------------------------------
      # Phase 0 — baseline. Record what a free runner actually gives us.
      # ----------------------------------------------------------------
      - name: Baseline disk + hardware
        run: |
          echo "::group::CPU / RAM"
          echo "vCPU: $(nproc)"
          free -h
          echo "::endgroup::"
          echo "::group::Disk BEFORE any cleanup"
          df -h /
          echo "::endgroup::"

      # ----------------------------------------------------------------
      # Phase 1 — reclaim disk. Removes preinstalled Android/.NET/Haskell/
      # tool-cache/Docker we never use. Measured ~+26 GiB → ~115 GB free on /.
      # ----------------------------------------------------------------
      - name: Free disk space (remove unused preinstalled SDKs)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false   # apt purge is slow; the +26 GiB above is plenty of headroom
          docker-images: true
          swap-storage: false     # keep the 3 GiB swap; the chrome link is RAM-hungry

      - name: Disk AFTER free-disk-space
        run: df -h /

      - name: Check out MoltBrowser overlay (no Chromium submodules)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ----------------------------------------------------------------
      # Phase 2 — depot_tools + Linux build deps (mirrors release-linux.yml).
      # ----------------------------------------------------------------
      - name: Install depot_tools
        run: |
          git clone --depth 1 \
            https://chromium.googlesource.com/chromium/tools/depot_tools.git \
            "$HOME/depot_tools"
          echo "$HOME/depot_tools" >> "$GITHUB_PATH"
          ( cd "$HOME/depot_tools" && ./update_depot_tools && ./gclient --version >/dev/null 2>&1 || true )

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang lld cmake ninja-build python3 python3-pip \
            git curl wget pkg-config gperf bison flex \
            libgtk-3-dev libglib2.0-dev libnss3-dev libatk1.0-dev \
            libatk-bridge2.0-dev libcups2-dev libdrm-dev libxkbcommon-dev \
            libxcomposite-dev libxdamage-dev libxrandr-dev libgbm-dev \
            libpango1.0-dev libasound2-dev libdbus-1-dev libexpat1-dev \
            libfontconfig1-dev libfreetype-dev libnspr4-dev libpulse-dev \
            libx11-xcb-dev libxcb-dri3-dev libxext-dev libxfixes-dev \
            libxi-dev libxrender-dev libxtst-dev libvulkan-dev vulkan-tools \
            dpkg-dev rpm fakeroot zip fonts-liberation fonts-noto-color-emoji

      - name: Disk AFTER deps + depot_tools
        run: df -h /

      # ----------------------------------------------------------------
      # Phase 3 — sync Chromium at the pinned revision into repo/chromium/src,
      # exactly where configure.sh / build.sh expect it. Same shallow /
      # no-history pattern as release-linux.yml. Hooks run (no --nohooks) so
      # the clang toolchain, sysroot, node and test fonts are fetched.
      # This is the first place disk could blow up — we print df right after.
      # ----------------------------------------------------------------
      - name: Sync Chromium source (pinned, shallow)
        run: |
          set -x
          mkdir -p chromium && cd chromium
          cat > .gclient <<'EOF'
          solutions = [
            {
              "name": "src",
              "url": "https://chromium.googlesource.com/chromium/src.git",
              "managed": False,
              "custom_deps": {},
              "custom_vars": {},
            },
          ]
          target_os = ['linux']
          EOF
          if [ ! -d src/.git ]; then
            mkdir -p src
            ( cd src && \
              git init -q && \
              git remote add origin https://chromium.googlesource.com/chromium/src.git && \
              git fetch --depth=1 --no-tags origin "${CHROMIUM_REVISION}" && \
              git checkout --detach FETCH_HEAD )
          fi
          ( cd src && git log -1 --format="HEAD = %H %s" ) | head -1
          gclient sync --revision "src@${CHROMIUM_REVISION}" --no-history --shallow

      - name: Disk AFTER gclient sync (checkout footprint)
        run: |
          df -h /
          echo "---- chromium/src size ----"
          du -sh chromium/src || true

      # ----------------------------------------------------------------
      # Phase 4 — overlay MoltBrowser's src/ + generate build files.
      # ----------------------------------------------------------------
      - name: Overlay MoltBrowser src onto the Chromium tree
        run: |
          cp -r src/* chromium/src/
          ls -ld chromium/src/base chromium/src/chrome

      - name: Configure GN (component build = ${{ inputs.component_build }})
        run: |
          # Default the probe to a faster component build unless a manual
          # dispatch asked for the official build. component_build cuts the
          # single-threaded RAM-hungry final link (Chromium's documented
          # linker-OOM workaround) and lowers peak per-link memory — which is
          # what lets the probe make honest progress under the 6 h / 15 GiB cap.
          # depot_tools' gn/ninja wrappers shell out to depot_tools' bundled
          # python3; that needs the bootstrap sentinel (python3_bin_reldir.txt).
          # $GITHUB_PATH already prepends depot_tools, but bootstrap the python
          # explicitly so `gn gen` doesn't die with "python3_bin_reldir.txt not
          # found. need to initialize depot_tools" (observed in run 28685135499).
          export PATH="$HOME/depot_tools:$PATH"
          ( cd "$HOME/depot_tools" && ./gclient --version >/dev/null 2>&1 || true )
          COMPONENT="${{ inputs.component_build }}"
          COMPONENT="${COMPONENT:-true}"   # push events carry no inputs → default true
          if [ "$COMPONENT" = "true" ]; then
            echo "Using is_component_build=true (fast probe config)."
            cd chromium/src
            mkdir -p out/MoltBrowser
            # Inline args mirroring configs/linux-x64.gn with the faster,
            # lower-RAM component-build knobs flipped on for the probe.
            cat > out/MoltBrowser/args.gn <<'EOF'
          target_os = "linux"
          target_cpu = "x64"
          is_debug = false
          is_official_build = false
          is_component_build = true
          symbol_level = 0
          blink_symbol_level = 0
          enable_nacl = false
          is_clang = true
          use_lld = true
          use_sysroot = true
          use_ozone = true
          ozone_auto_platforms = true
          google_api_key = ""
          google_default_client_id = ""
          google_default_client_secret = ""
          safe_browsing_mode = 1
          enable_reporting = false
          enable_supervised_users = true
          is_chrome_branded = false
          enable_extensions = true
          chrome_pgo_phase = 0
          treat_warnings_as_errors = false
          EOF
            # Prefer the checkout's own gn (fetched by sync into
            # buildtools/linux64/gn) over the depot_tools python wrapper — it
            # needs no python bootstrap, so gn gen can't hit the sentinel error.
            if [ -x buildtools/linux64/gn ]; then
              buildtools/linux64/gn gen out/MoltBrowser
            else
              gn gen out/MoltBrowser
            fi
          else
            echo "Using official build config from configs/linux-x64.gn."
            ./scripts/configure.sh --platform linux --arch x64
          fi

      - name: Disk AFTER gn gen
        run: df -h /

      # ----------------------------------------------------------------
      # Phase 5 — the real test: run autoninja for a bounded budget and report
      # exactly how far it got. `timeout` ends the compile cleanly so the next
      # step can read progress from the ninja log, instead of the job being
      # killed at the 6 h wall with no signal. -k 0 keeps going past a single
      # failing target so we learn the real ceiling, not just the first error.
      # ----------------------------------------------------------------
      - name: Build chrome (bounded budget) + capture progress
        id: build
        run: |
          export PATH="$HOME/depot_tools:$PATH"
          # Same depot_tools python bootstrap guard as the Configure GN step so
          # autoninja's wrapper never hits the python3_bin_reldir.txt error.
          ( cd "$HOME/depot_tools" && ./gclient --version >/dev/null 2>&1 || true )
          cd chromium/src
          BUDGET="${{ inputs.build_budget_min }}"
          BUDGET="${BUDGET:-180}"
          echo "Letting autoninja run for up to ${BUDGET} min on $(nproc) cores..."
          echo "Started: $(date -u)"
          set +e
          timeout "${BUDGET}m" autoninja -C out/MoltBrowser chrome 2>&1 | tee /tmp/ninja.log
          RC=$?
          set -e
          echo "autoninja exit: ${RC} (124 = hit the time budget, still compiling)"
          echo "Finished: $(date -u)"
          echo "rc=${RC}" >> "$GITHUB_OUTPUT"

      - name: Report build progress + final disk
        if: always()
        run: |
          {
            echo "## Free-runner Linux x64 probe — results"
            echo ""
            echo "### Runner"
            echo "- vCPU: $(nproc), RAM: $(free -h | awk '/Mem:/{print $2}'), swap: $(free -h | awk '/Swap:/{print $2}')"
            echo ""
            echo "### Disk at end (root /)"
            echo '```'
            df -h /
            echo '```'
            echo ""
            echo "### out/ size"
            du -sh chromium/src/out/MoltBrowser 2>/dev/null || echo "(none)"
            echo ""
            echo "### Last ninja progress line (X/N steps)"
            echo '```'
            grep -oE '\[[0-9]+/[0-9]+\]' /tmp/ninja.log 2>/dev/null | tail -1 || echo "(no ninja progress captured)"
            echo '```'
            echo ""
            echo "### Tail of ninja log"
            echo '```'
            tail -40 /tmp/ninja.log 2>/dev/null || echo "(no log)"
            echo '```'
            if [ -f chromium/src/out/MoltBrowser/chrome ]; then
              echo ""
              echo "**chrome binary WAS produced** :white_check_mark:"
              ls -lh chromium/src/out/MoltBrowser/chrome
            else
              echo ""
              echo "_chrome binary not yet produced at end of budget._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

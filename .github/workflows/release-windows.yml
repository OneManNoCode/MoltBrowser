name: Release Windows build

# RESUMABLE Windows x64 build for FREE GitHub runners — whole-tree persist.
#
# Background: a full Chromium compile takes >6h on a free 4-core runner,
# over GitHub's 6h job cap. We resume across chained ~4h runs. The FIRST
# resumable design persisted only chromium/src/out and re-synced source
# each run — but a fresh sync gives every source file a new mtime, so
# ninja/siso rebuilt the same ~40% every run and never converged (proven:
# 14h, 4 runs, stuck at 40%).
#
# THE FIX (this design): persist the ENTIRE chromium/ tree (source +
# build output) between runs. tar preserves mtimes, so restored source
# stays OLDER than its restored .obj files → real incremental resume.
# We sync source ONLY on the cold first run; warm runs just restore the
# tree and keep compiling where they left off.
#
# Artifact: ~12-15GB compressed, split into <2GB chunks (upload-artifact
# has a per-file Buffer ceiling) and restored via gh CLI (Go, no limit).
# Public repos get unlimited free Actions + artifact storage → $0.
# Expected ~3 chained runs (cold ~40%, warm ~75%, warm finish).

# Manual only. Windows builds are paused (see CLAUDE.md), and an automatic
# run on every v* tag could publish a build restored from an unvetted
# artifact (see the restore step below).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to attach binaries to'
        required: true
        type: string
        default: 'v0.2.1'
      attempt:
        description: 'Resume attempt counter (auto-incremented)'
        required: false
        type: string
        default: '1'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 350
    permissions:
      contents: write       # upload release assets
      actions: write        # read tree artifacts + queue the next resume run
      id-token: write       # build-provenance attestation (OIDC)
      attestations: write

    defaults:
      run:
        shell: bash

    env:
      # CHROMIUM_REVISION is read from chromium_version.txt after checkout.
      DEPOT_TOOLS_WIN_TOOLCHAIN: "0"
      GYP_MSVS_VERSION: "2022"
      MAX_ATTEMPTS: "12"
      MOLT_RELEASE_BUILD: "1"   # bundle downloads must match their pins
      ARTIFACT_NAME: "chromium-tree"
      MSYS_NO_PATHCONV: "1"
      MSYS2_ARG_CONV_EXCL: "*"

    steps:
      - name: Check out repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Read Chromium pin (chromium_version.txt)
        run: tools/chromium/pin.sh env >> "$GITHUB_ENV"

      - name: Determine target tag + attempt
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_ATTEMPT: ${{ inputs.attempt }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
            ATTEMPT="$INPUT_ATTEMPT"
          else
            TAG="${GITHUB_REF#refs/tags/}"
            ATTEMPT=1
          fi
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$TAG' is not a release tag (vX.Y.Z[-suffix])"
            exit 1
          fi
          if ! [[ "$ATTEMPT" =~ ^[0-9]+$ ]]; then
            echo "::error::attempt must be a number, got '$ATTEMPT'"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "attempt=$ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Free up disk on the runner
        run: |
          df -h || true
          rm -rf "/c/Program Files (x86)/Android" || true
          rm -rf "/c/Program Files (x86)/Microsoft Visual Studio/2019" || true
          rm -rf "/c/Program Files/dotnet" || true
          rm -rf "/c/hostedtoolcache/windows/Ruby" || true
          rm -rf "/c/hostedtoolcache/windows/go" || true
          df -h || true

      - name: Install depot_tools
        run: |
          git clone --depth 1 \
            https://chromium.googlesource.com/chromium/tools/depot_tools.git \
            "$HOME/depot_tools"
          echo "$HOME/depot_tools" >> "$GITHUB_PATH"

      - name: Bootstrap depot_tools
        env:
          DEPOT_TOOLS_UPDATE: "1"
        run: |
          cd "$HOME/depot_tools"
          ./update_depot_tools.bat || true
          ./gclient --version || true

      # ---- RESUME: restore the WHOLE chromium tree from a prior run ----
      # Download via gh CLI (Go — no 2GB Buffer cap). The tree is stored
      # as <2GB chunks (chromium.tar.zst.part-*). Reassemble + extract;
      # tar preserves source mtimes so the resumed build is truly
      # incremental.
      # Only trust tree artifacts built in this repository itself: a
      # fork PR run can upload an artifact with the same name.
      - name: Restore chromium tree (if any)
        id: restore
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          ART_ID=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/artifacts" \
            --jq "[.artifacts[] | select(.name==\"${ARTIFACT_NAME}\" and .expired==false and .workflow_run.head_repository_id==${GITHUB_REPOSITORY_ID})] | sort_by(.created_at) | last | .id" || echo "")
          echo "Latest ${ARTIFACT_NAME} artifact id: ${ART_ID:-none}"
          if [ -n "$ART_ID" ] && [ "$ART_ID" != "null" ]; then
            echo "Downloading tree artifact $ART_ID via gh..."
            if gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ART_ID/zip" > tree.zip; then
              ls -lh tree.zip
              mkdir -p tree-tmp
              unzip -o -q tree.zip -d tree-tmp || true
              if ls tree-tmp/chromium.tar.zst.part-* >/dev/null 2>&1; then
                echo "Reassembling + extracting whole tree (preserves mtimes)..."
                cat tree-tmp/chromium.tar.zst.part-* \
                  | tar --use-compress-program=zstd -xf - \
                  && echo "restored=true" >> "$GITHUB_OUTPUT" \
                  && echo "TREE_RESTORE_OK"
                du -sh chromium/src 2>/dev/null || true
                du -sh chromium/src/out/MoltBrowser 2>/dev/null || true
              else
                echo "Artifact had no chunks — cold start."
              fi
              rm -rf tree.zip tree-tmp
            else
              echo "Download failed — cold start."
            fi
          else
            echo "No prior tree — cold start."
          fi

      # ---- COLD START ONLY: sync source + overlays (skipped on resume) ----
      - name: Sync Chromium source (cold start only)
        if: steps.restore.outputs.restored != 'true'
        env:
          DEPOT_TOOLS_UPDATE: "0"
        run: |
          set -x
          mkdir -p chromium && cd chromium
          cat > .gclient <<'EOF'
          solutions = [
            {
              "name": "src",
              "url": "https://chromium.googlesource.com/chromium/src.git",
              "custom_deps": {},
              "custom_vars": {},
            },
          ]
          target_os = ['win']
          EOF
          if [ ! -d src/.git ]; then
            mkdir -p src
            (cd src && \
              git init -q && \
              git remote add origin https://chromium.googlesource.com/chromium/src.git && \
              git fetch --depth=1 --no-tags origin "${CHROMIUM_REVISION}" && \
              git checkout --detach FETCH_HEAD)
          fi
          (cd src && git log -1 --format="HEAD = %H %s") | head -1
          gclient sync --revision "src@${CHROMIUM_REVISION}" --no-history --shallow

      - name: Copy MoltBrowser overlays (cold start only)
        if: steps.restore.outputs.restored != 'true'
        run: |
          cp -r src/* chromium/src/

      - name: Configure (gn gen)
        run: |
          ./scripts/configure.sh --platform windows --arch x64

      - name: Build chrome (time-limited, resumable)
        id: build
        continue-on-error: true
        timeout-minutes: 240   # 4h compile; ~1.5h headroom for big tree save
        run: |
          export PATH="$HOME/depot_tools:$PATH"
          cd chromium/src
          autoninja -C out/MoltBrowser chrome

      - name: Determine build status
        id: status
        if: always()
        run: |
          if [ -f chromium/src/out/MoltBrowser/chrome.exe ]; then
            echo "status=complete" >> "$GITHUB_OUTPUT"
            echo "✅ BUILD COMPLETE — chrome.exe exists"
          else
            echo "status=partial" >> "$GITHUB_OUTPUT"
            echo "⏳ BUILD PARTIAL — saving tree + chaining"
          fi

      # ---- complete: package + ship ----
      - name: Package Windows installer + checksums
        id: package
        if: always() && steps.status.outputs.status == 'complete'
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          # dist/ may hold earlier packages: never let a stale one be published.
          rm -f dist/MoltBrowser-*-win-x64-setup.exe dist/MoltBrowser-*-win-x64-portable.zip \
            dist/MoltBrowser-Windows-x64-Setup.exe dist/MoltBrowser-Windows-x64.zip
          ./scripts/package-win.sh --version "$TAG"
          cd dist
          # Exactly one installer (required) and at most one portable zip.
          mapfile -t setup < <(compgen -G 'MoltBrowser-*-win-x64-setup.exe')
          if [ "${#setup[@]}" -ne 1 ]; then
            echo "::error::expected one installer in dist/, found ${#setup[@]}: ${setup[*]}"
            exit 1
          fi
          mv "${setup[0]}" MoltBrowser-Windows-x64-Setup.exe
          mapfile -t zips < <(compgen -G 'MoltBrowser-*-win-x64-portable.zip')
          if [ "${#zips[@]}" -gt 1 ]; then
            echo "::error::more than one portable zip in dist/: ${zips[*]}"
            exit 1
          fi
          [ "${#zips[@]}" -eq 1 ] && mv "${zips[0]}" MoltBrowser-Windows-x64.zip
          ls -lh
          files=(MoltBrowser-Windows-x64-Setup.exe)
          [ -f MoltBrowser-Windows-x64.zip ] && files+=(MoltBrowser-Windows-x64.zip)
          ../scripts/release-checksums.sh SHA256SUMS-windows-x64 "${files[@]}"
          { echo "files<<EOF"; printf 'dist/%s\n' "${files[@]}"; echo "EOF"; } >> "$GITHUB_OUTPUT"

      - name: Build provenance attestation
        if: always() && steps.status.outputs.status == 'complete'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.files }}

      - name: Upload installer to the DRAFT release
        if: always() && steps.status.outputs.status == 'complete'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          FILES: ${{ steps.package.outputs.files }}
        run: |
          ./scripts/release-draft.sh "$TAG" --repo "$GITHUB_REPOSITORY"
          mapfile -t files <<< "$FILES"
          gh release upload "$TAG" "${files[@]}" dist/SHA256SUMS-windows-x64 \
            --repo "$GITHUB_REPOSITORY" --clobber
          echo "Windows assets uploaded. The release stays a DRAFT until the signed manifest is attached."

      # ---- partial: save the WHOLE tree (chunked) + chain ----
      - name: Save chromium tree (chunked)
        if: always() && steps.status.outputs.status == 'partial'
        run: |
          echo "Tar+zstd the whole chromium/ tree, split into <2GB chunks..."
          # Drop the shallow .git (~2-3GB) — warm runs never re-sync, so
          # history isn't needed; LASTCHANGE files were already generated.
          rm -rf chromium/src/.git || true
          tar --warning=no-file-changed --warning=no-file-removed \
            --ignore-failed-read \
            --use-compress-program="zstd -3 -T0" -cf - chromium \
            | split -b 1900M - chromium.tar.zst.part- || true
          ls -lh chromium.tar.zst.part-* || true
          # Verify at least one chunk exists and is non-empty
          ok=false
          for chunk in chromium.tar.zst.part-*; do
            [ -s "$chunk" ] && ok=true
          done
          if [ "$ok" != true ]; then
            echo "::error::tree save produced no usable chunks"
          fi

      - name: Upload chromium tree
        if: always() && steps.status.outputs.status == 'partial'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: chromium-tree
          path: chromium.tar.zst.part-*
          retention-days: 3
          overwrite: true

      - name: Chain the next resume run
        if: always() && steps.status.outputs.status == 'partial'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          ATTEMPT: ${{ steps.meta.outputs.attempt }}
        run: |
          NEXT=$(( ATTEMPT + 1 ))
          if [ "$NEXT" -gt "${MAX_ATTEMPTS}" ]; then
            echo "::error::Reached MAX_ATTEMPTS (${MAX_ATTEMPTS})."
            exit 1
          fi
          gh workflow run release-windows.yml \
            --repo "$GITHUB_REPOSITORY" \
            -f tag="$TAG" \
            -f attempt="$NEXT"
          echo "▶ Resume run #$NEXT queued."

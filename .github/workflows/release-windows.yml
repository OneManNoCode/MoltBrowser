name: Release Windows build

# RESUMABLE Windows x64 build pipeline for FREE GitHub-hosted runners.
#
# The problem: a full Chromium compile takes ~6.5 hours on a free
# windows-latest runner (4 cores), but GitHub hard-caps each job at 6
# hours. Run #10 (official build) died at 6h15m; run #11 (stripped
# build) also exceeded 6h. Free 4-core runners simply cannot finish in
# one slot.
#
# The free solution: incremental resume. ninja/siso builds are
# incremental — already-compiled .obj files don't get rebuilt. So we:
#   1. Build for ~4 hours (self-limited, well under the 6h cap)
#   2. Save the build directory (chromium/src/out) as an artifact
#   3. Auto-trigger the next run, which restores the build dir and
#      continues where the last one stopped
#   4. Repeat until chrome.exe exists, then package + upload the .exe
#
# Public repos get unlimited free Actions minutes + free artifact
# storage, so this costs nothing. Wall-clock is ~2-3 chained runs
# (~12-18h) but it's fully automated and $0.
#
# Each run re-syncs the (pinned, deterministic) Chromium source. We
# rely on siso's content-hash-based incremental build so that fresh
# source mtimes don't force a full rebuild — only genuinely-changed or
# not-yet-built objects compile.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to attach binaries to (e.g., v0.2.1)'
        required: true
        type: string
        default: 'v0.2.1'
      attempt:
        description: 'Resume attempt counter (auto-incremented by the chain)'
        required: false
        type: string
        default: '1'

permissions:
  contents: write   # upload release assets
  actions: write    # self-trigger the next run in the chain

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 350   # 5h50m — self-limit under GitHub's 6h hard cap

    defaults:
      run:
        shell: bash

    env:
      CHROMIUM_REVISION: "51a413be46f7632ebc3ae331c68af71daa5d6bbf"
      DEPOT_TOOLS_WIN_TOOLCHAIN: "0"
      GYP_MSVS_VERSION: "2022"
      # Build budget in seconds before we stop ninja to leave room for
      # saving the partial build dir. 3.75h compile + ~2h overhead < 6h.
      BUILD_TIMEOUT_SECONDS: "13500"
      MAX_ATTEMPTS: "10"

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Determine target tag + attempt
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> $GITHUB_OUTPUT
            echo "attempt=${{ inputs.attempt }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
            echo "attempt=1" >> $GITHUB_OUTPUT
          fi
          echo "Build attempt #${{ inputs.attempt }} for tag ${{ inputs.tag }}"

      - name: Free up disk on the runner
        run: |
          df -h || true
          rm -rf "/c/Program Files (x86)/Android" || true
          rm -rf "/c/Program Files (x86)/Microsoft Visual Studio/2019" || true
          rm -rf "/c/Program Files/dotnet" || true
          rm -rf "/c/hostedtoolcache/windows/Ruby" || true
          rm -rf "/c/hostedtoolcache/windows/go" || true
          df -h || true

      - name: Install depot_tools
        run: |
          git clone --depth 1 \
            https://chromium.googlesource.com/chromium/tools/depot_tools.git \
            "$HOME/depot_tools"
          echo "$HOME/depot_tools" >> $GITHUB_PATH

      - name: Bootstrap depot_tools
        env:
          DEPOT_TOOLS_UPDATE: "1"
        run: |
          cd "$HOME/depot_tools"
          ./update_depot_tools.bat || true
          ./gclient --version || true

      - name: Sync Chromium source (pinned)
        env:
          DEPOT_TOOLS_UPDATE: "0"
        run: |
          set -x
          mkdir -p chromium && cd chromium
          cat > .gclient <<'EOF'
          solutions = [
            {
              "name": "src",
              "url": "https://chromium.googlesource.com/chromium/src.git",
              "custom_deps": {},
              "custom_vars": {},
            },
          ]
          target_os = ['win']
          EOF
          if [ ! -d src/.git ]; then
            mkdir -p src
            (cd src && \
              git init -q && \
              git remote add origin https://chromium.googlesource.com/chromium/src.git && \
              git fetch --depth=1 --no-tags origin "${CHROMIUM_REVISION}" && \
              git checkout --detach FETCH_HEAD)
          fi
          (cd src && git log -1 --format="HEAD = %H %s") | head -1
          gclient sync --revision "src@${CHROMIUM_REVISION}" --no-history --shallow

      - name: Copy MoltBrowser source overlays
        run: |
          cp -r src/* chromium/src/

      # ---- RESUME: restore partial build dir via gh CLI ----
      # CRITICAL: download with `gh` (Go, no size limit), NOT a Node-based
      # action. dawidd6/action-download-artifact choked on >2GB artifacts
      # with "length out of range ... 2147483647" (the 2GB Node Buffer
      # cap), which silently broke every resume for 5 attempts. gh CLI
      # streams the artifact zip with no such limit.
      - name: Restore previous build directory (if any)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          ART_ID=$(gh api --paginate \
            "/repos/${{ github.repository }}/actions/artifacts" \
            --jq '[.artifacts[] | select(.name=="windows-build-out" and .expired==false)] | sort_by(.created_at) | last | .id')
          echo "Latest windows-build-out artifact id: ${ART_ID:-none}"
          if [ -n "$ART_ID" ] && [ "$ART_ID" != "null" ]; then
            echo "Downloading artifact $ART_ID via gh (handles >2GB)..."
            gh api "/repos/${{ github.repository }}/actions/artifacts/$ART_ID/zip" > artifact.zip
            ls -lh artifact.zip
            mkdir -p restore-tmp
            unzip -o -q artifact.zip -d restore-tmp
            ls -lh restore-tmp/
            if [ -f restore-tmp/out.tar.zst ]; then
              echo "Extracting build dir — resuming incrementally..."
              tar --use-compress-program=zstd -xf restore-tmp/out.tar.zst -C chromium/src/
              du -sh chromium/src/out/MoltBrowser 2>/dev/null || true
            elif ls restore-tmp/out.tar.zst.part-* >/dev/null 2>&1; then
              cat restore-tmp/out.tar.zst.part-* \
                | tar --use-compress-program=zstd -xf - -C chromium/src/
              du -sh chromium/src/out/MoltBrowser 2>/dev/null || true
            fi
            rm -f artifact.zip
          else
            echo "No prior artifact — fresh start."
          fi

      - name: Configure (gn gen)
        run: |
          ./scripts/configure.sh --platform windows --arch x64

      # Build with a STEP-LEVEL timeout (portable; no GNU `timeout`
      # dependency). continue-on-error means a timeout doesn't fail the
      # job — the next step inspects the result and decides what to do.
      # autoninja is incremental: restored .obj files are not rebuilt.
      - name: Build chrome (time-limited, resumable)
        id: build
        continue-on-error: true
        timeout-minutes: 225   # 3h45m of compile; leaves room for save+chain
        run: |
          export PATH="$HOME/depot_tools:$PATH"
          cd chromium/src
          autoninja -C out/MoltBrowser chrome

      - name: Determine build status
        id: status
        if: always()
        run: |
          if [ -f chromium/src/out/MoltBrowser/chrome.exe ]; then
            echo "status=complete" >> $GITHUB_OUTPUT
            echo "✅ BUILD COMPLETE — chrome.exe exists"
          else
            echo "status=partial" >> $GITHUB_OUTPUT
            echo "⏳ BUILD PARTIAL — will save progress and chain next run"
          fi

      # ---- If complete: package + upload the installer ----
      - name: Package Windows installer
        if: always() && steps.status.outputs.status == 'complete'
        run: |
          ./scripts/package-win.sh --version "${{ steps.meta.outputs.tag }}" || true
          cd dist
          for f in MoltBrowser-*-win-x64-setup.exe; do
            mv "$f" MoltBrowser-Windows-x64-Setup.exe 2>/dev/null || true
          done
          for f in MoltBrowser-*-win-x64.zip; do
            mv "$f" MoltBrowser-Windows-x64.zip 2>/dev/null || true
          done
          ls -lh

      - name: Upload installer to release
        if: always() && steps.status.outputs.status == 'complete'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.meta.outputs.tag }}" \
            dist/MoltBrowser-Windows-x64-Setup.exe \
            --repo "${{ github.repository }}" --clobber
          if [ -f dist/MoltBrowser-Windows-x64.zip ]; then
            gh release upload "${{ steps.meta.outputs.tag }}" \
              dist/MoltBrowser-Windows-x64.zip \
              --repo "${{ github.repository }}" --clobber
          fi
          echo "🎉 Windows build complete and uploaded!"

      # ---- If partial: save build dir + chain the next run ----
      - name: Save partial build directory
        if: always() && steps.status.outputs.status == 'partial'
        run: |
          cd chromium/src
          echo "Compressing out/MoltBrowser..."
          # Single file is fine — upload-artifact@v4 handles >2GB on
          # upload, and we restore with gh CLI which has no size cap.
          tar --use-compress-program="zstd -3 -T0" \
            -cf ../../out.tar.zst out/MoltBrowser
          cd ../..
          ls -lh out.tar.zst

      - name: Upload partial build directory
        if: always() && steps.status.outputs.status == 'partial'
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-out
          path: out.tar.zst
          retention-days: 3
          overwrite: true

      - name: Chain the next resume run
        if: always() && steps.status.outputs.status == 'partial'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEXT=$(( ${{ steps.meta.outputs.attempt }} + 1 ))
          if [ "$NEXT" -gt "${MAX_ATTEMPTS}" ]; then
            echo "::error::Reached MAX_ATTEMPTS (${MAX_ATTEMPTS}) without finishing."
            exit 1
          fi
          echo "Triggering resume run #$NEXT..."
          gh workflow run release-windows.yml \
            --repo "${{ github.repository }}" \
            -f tag="${{ steps.meta.outputs.tag }}" \
            -f attempt="$NEXT"
          echo "▶ Resume run #$NEXT queued. This run ends (partial)."

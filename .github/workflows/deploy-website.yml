name: Deploy website to GitHub Pages

# Auto-publishes website/ to GitHub Pages on every push to main.
# The CNAME inside website/ pins the site to moltbrowser.com.
# Setup needed once in repo Settings → Pages:
#   Source: GitHub Actions
# And in DNS:
#   moltbrowser.com  CNAME  onemannocode.github.io
#   www.moltbrowser.com  CNAME  onemannocode.github.io

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write      # publish to GitHub Pages
      id-token: write   # deploy-pages authenticates with OIDC
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/configure-pages@1f0c5cde4bc74cd7e1254d0cb4de8d49e9068c7d  # v4.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3.0.1
        with:
          path: website/
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4.0.5

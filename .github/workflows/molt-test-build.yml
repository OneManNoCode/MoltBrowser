# MoltBrowser test build: Chromium with the overlay, built for real and
# tested, on GitHub's free runners (Linux x64).
# Copyright 2026 GenEye AI Labs Inc.
#
# A from-scratch build of chrome, molt_ai_unittests and browser_tests takes
# longer than one 6-hour job on a 4-core runner, so it runs as a chain of
# stages (molt-test-build-stage.yml). Each stage carries the out dir to the
# next as artifacts; the first stage that finds the build complete runs
# MoltBrowser's unit and browser tests. A run can resume from an earlier
# run's out dir (resume_run), so after a fix only what changed is rebuilt.
#
# It is a component build with DCHECKs on: a test build, not a release.
# Releases are built by release-*.yml and signed offline.
#
# Trigger: Actions > "MoltBrowser test build" > Run workflow
# (gh workflow run molt-test-build.yml -f resume_run=<run id>), or a push
# to a claude/ branch that changes .github/molt-test-build.json, whose
# fields are the same inputs: {"resume_run": "<run id or empty>",
# "run_tests": true, "e2e_only": false, "e2e_runs": "", "e2e_scenarios":
# ""}. With e2e_only, only the spoken suite runs, on the build
# resume_run's last stage saved. e2e_runs picks the spoken suite's runs
# (default pulse:clean,pulse:music10,file:clean,typed), e2e_scenarios its
# scenarios (comma-separated ids; default all); "e2e_speech_check": false
# skips checking the rendered speech against the recognizer (an hour);
# "e2e_field_trials": "Trial/Group/" pairs start the suite's browser with
# --force-fieldtrials (a setting tried without a build); "e2e_model": a
# chat model registry id (e.g. "tinyllama-1.1b") gives the suite that real
# model, downloaded at its pin and checked (tools/models/fetch_model.py),
# for the scenarios that need one and the planner.

name: MoltBrowser test build

on:
  push:
    branches: ['claude/**']
    paths: ['.github/molt-test-build.json']
  workflow_dispatch:
    inputs:
      resume_run:
        description: 'Run id whose out dir to start from (empty: build from scratch)'
        type: string
        default: ''
      run_tests:
        description: 'Run the tests once the build is complete'
        type: boolean
        default: true
      e2e_only:
        description: "Only the spoken suite, on resume_run's saved build"
        type: boolean
        default: false
      e2e_runs:
        description: 'The spoken suite runs, comma-separated (empty: all four)'
        type: string
        default: ''
      e2e_scenarios:
        description: 'The spoken suite scenario ids, comma-separated (empty: all)'
        type: string
        default: ''

permissions:
  contents: read
  actions: read

# A newer request replaces a build still running on the same branch; it
# can resume from the last stage the cancelled run saved (resume_run).
concurrency:
  group: molt-test-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  config:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      resume_run: ${{ steps.config.outputs.resume_run }}
      run_tests: ${{ steps.config.outputs.run_tests }}
      e2e_only: ${{ steps.config.outputs.e2e_only }}
      e2e_matrix: ${{ steps.config.outputs.e2e_matrix }}
      e2e_scenarios: ${{ steps.config.outputs.e2e_scenarios }}
      e2e_field_trials: ${{ steps.config.outputs.e2e_field_trials }}
      e2e_model: ${{ steps.config.outputs.e2e_model }}
      vendor_dump: ${{ steps.config.outputs.vendor_dump }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: .github
      - name: Inputs
        id: config
        env:
          EVENT: ${{ github.event_name }}
          IN_RESUME: ${{ inputs.resume_run }}
          IN_TESTS: ${{ inputs.run_tests }}
          IN_E2E_ONLY: ${{ inputs.e2e_only }}
          IN_E2E_RUNS: ${{ inputs.e2e_runs }}
          IN_E2E_SCENARIOS: ${{ inputs.e2e_scenarios }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = push ]; then
            RESUME="$(jq -r '.resume_run // ""' .github/molt-test-build.json)"
            TESTS="$(jq -r 'if .run_tests == false then "false" else "true" end' .github/molt-test-build.json)"
            E2E_ONLY="$(jq -r 'if .e2e_only == true then "true" else "false" end' .github/molt-test-build.json)"
            E2E_RUNS="$(jq -r '.e2e_runs // ""' .github/molt-test-build.json)"
            E2E_SCENARIOS="$(jq -r '.e2e_scenarios // ""' .github/molt-test-build.json)"
            SPEECH_CHECK="$(jq -r 'if .e2e_speech_check == false then "0" else "1" end' .github/molt-test-build.json)"
            FIELD_TRIALS="$(jq -r '.e2e_field_trials // ""' .github/molt-test-build.json)"
            MODEL="$(jq -r '.e2e_model // ""' .github/molt-test-build.json)"
            VENDOR_DUMP="$(jq -r 'if .vendor_dump == true then "true" else "false" end' .github/molt-test-build.json)"
          else
            VENDOR_DUMP=false
            FIELD_TRIALS=""
            MODEL=""
            SPEECH_CHECK=1
            RESUME="$IN_RESUME"; TESTS="$IN_TESTS"; E2E_ONLY="$IN_E2E_ONLY"
            E2E_RUNS="$IN_E2E_RUNS"; E2E_SCENARIOS="$IN_E2E_SCENARIOS"
          fi
          E2E_RUNS="${E2E_RUNS:-pulse:clean,pulse:music10,file:clean,typed}"
          if ! [[ "$E2E_RUNS" =~ ^(pulse:[a-z0-9]+(:noloop|:noaec)?|file:[a-z0-9]+|typed)(,(pulse:[a-z0-9]+(:noloop|:noaec)?|file:[a-z0-9]+|typed))*$ ]]; then
            echo "::error::e2e_runs must be runs like pulse:clean,pulse:clean:noloop,pulse:clean:noaec,typed"; exit 1
          fi
          if ! [[ "$E2E_SCENARIOS" =~ ^[a-z0-9,-]*$ ]]; then
            echo "::error::e2e_scenarios must be scenario ids, comma-separated"; exit 1
          fi
          # Field trials for the browser the spoken suite runs
          # (--force-fieldtrials), to try a setting without a build:
          # Trial/Group/ pairs only.
          if ! [[ "$FIELD_TRIALS" =~ ^([A-Za-z0-9_-]+/[A-Za-z0-9_-]+/)*$ ]]; then
            echo "::error::e2e_field_trials must be Trial/Group/ pairs"; exit 1
          fi
          # A real on-device model for the scenarios that need one: an id
          # of the chat model registry (browser_ai_runtime.cc), pinned.
          if ! [[ "$MODEL" =~ ^([a-z0-9][a-z0-9.-]{0,63})?$ ]]; then
            echo "::error::e2e_model must be a model registry id"; exit 1
          fi
          # One job per run; the first checks the speech against the
          # recognizer too.
          MATRIX="$(tr ',' '\n' <<< "$E2E_RUNS" | jq -R . | jq -cs --arg check "$SPEECH_CHECK" \
            '{include: [to_entries[] | {run: .value, name: (.value | gsub(":"; "-")),
                                         speech_check: (if .key == 0 then $check else "0" end)}]}')"
          if [ -n "$RESUME" ] && ! [[ "$RESUME" =~ ^[0-9]+$ ]]; then
            echo "::error::resume_run must be a run id"; exit 1
          fi
          if [ "$E2E_ONLY" = true ] && [ -z "$RESUME" ]; then
            echo "::error::e2e_only needs resume_run"; exit 1
          fi
          if [ "$E2E_ONLY" = true ]; then TESTS=true; fi
          {
            echo "resume_run=$RESUME"
            echo "run_tests=$TESTS"
            echo "e2e_only=$E2E_ONLY"
            echo "e2e_matrix=$MATRIX"
            echo "e2e_scenarios=$E2E_SCENARIOS"
            echo "e2e_field_trials=$FIELD_TRIALS"
            echo "e2e_model=$MODEL"
            echo "vendor_dump=$VENDOR_DUMP"
          } >> "$GITHUB_OUTPUT"
          echo "resume_run='$RESUME' run_tests=$TESTS e2e_only=$E2E_ONLY"
          echo "e2e: $MATRIX scenarios='$E2E_SCENARIOS' field trials='$FIELD_TRIALS' model='$MODEL'"

  # Alongside stage 1 of a resumed build: the steps the restored build
  # failed, rebuilt on their own, so their errors (or their fix) show in
  # this job's log within the hour.
  recheck:
    needs: config
    if: >-
      needs.config.outputs.resume_run != '' &&
      needs.config.outputs.e2e_only != 'true'
    uses: ./.github/workflows/molt-test-build-stage.yml
    with:
      stage: 1
      resume_run: ${{ needs.config.outputs.resume_run }}
      run_tests: false
      recheck: true
      vendor_dump: ${{ needs.config.outputs.vendor_dump == 'true' }}

  stage-1:
    needs: config
    if: needs.config.outputs.e2e_only != 'true'
    uses: ./.github/workflows/molt-test-build-stage.yml
    with:
      stage: 1
      resume_run: ${{ needs.config.outputs.resume_run }}
      run_tests: ${{ needs.config.outputs.run_tests == 'true' }}
      vendor_dump: ${{ needs.config.outputs.vendor_dump == 'true' }}

  stage-2:
    needs: [config, stage-1]
    if: >-
      needs.stage-1.outputs.status == 'partial' ||
      (needs.config.outputs.run_tests == 'true' && needs.stage-1.outputs.tested != 'true')
    uses: ./.github/workflows/molt-test-build-stage.yml
    with:
      stage: 2
      run_tests: ${{ needs.config.outputs.run_tests == 'true' }}
      vendor_dump: ${{ needs.config.outputs.vendor_dump == 'true' }}

  stage-3:
    needs: [config, stage-2]
    if: >-
      needs.stage-2.outputs.status == 'partial' ||
      (needs.config.outputs.run_tests == 'true' && needs.stage-2.outputs.tested != 'true')
    uses: ./.github/workflows/molt-test-build-stage.yml
    with:
      stage: 3
      run_tests: ${{ needs.config.outputs.run_tests == 'true' }}
      vendor_dump: ${{ needs.config.outputs.vendor_dump == 'true' }}

  stage-4:
    needs: [config, stage-3]
    if: >-
      needs.stage-3.outputs.status == 'partial' ||
      (needs.config.outputs.run_tests == 'true' && needs.stage-3.outputs.tested != 'true')
    uses: ./.github/workflows/molt-test-build-stage.yml
    with:
      stage: 4
      run_tests: ${{ needs.config.outputs.run_tests == 'true' }}
      vendor_dump: ${{ needs.config.outputs.vendor_dump == 'true' }}

  stage-5:
    needs: [config, stage-4]
    if: >-
      needs.stage-4.outputs.status == 'partial' ||
      (needs.config.outputs.run_tests == 'true' && needs.stage-4.outputs.tested != 'true')
    uses: ./.github/workflows/molt-test-build-stage.yml
    with:
      stage: 5
      run_tests: ${{ needs.config.outputs.run_tests == 'true' }}
      vendor_dump: ${{ needs.config.outputs.vendor_dump == 'true' }}

  # The speech and voice helpers with their models, for the spoken suite
  # (molt-speech-bundle.yml; cached by their sources).
  speech-bundle:
    needs: config
    if: needs.config.outputs.run_tests == 'true'
    uses: ./.github/workflows/molt-speech-bundle.yml

  # The spoken end-to-end suite (tools/voice_e2e, docs/VOICE_E2E.md) on the
  # build the stage that ran the tests saved. It needs no Chromium checkout:
  # the out dir of a component build runs on its own. One job per run (the
  # verdict is per run: each must meet Phase 1's exit), in parallel. Not on
  # a build with failed steps: its browser may be an earlier build's.
  voice-e2e:
    needs: [config, speech-bundle, stage-1, stage-2, stage-3, stage-4, stage-5]
    if: >-
      always() && !cancelled() && needs.speech-bundle.result == 'success' &&
      ((contains(needs.*.outputs.tested, 'true') &&
        !contains(needs.*.outputs.status, 'errors')) ||
       needs.config.outputs.e2e_only == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.config.outputs.e2e_matrix) }}
    env:
      GH_TOKEN: ${{ github.token }}
      VOICE_E2E_RUNS: ${{ matrix.run }}
      VOICE_E2E_SPEECH_CHECK: ${{ matrix.speech_check }}
      VOICE_E2E_SCENARIOS: ${{ needs.config.outputs.e2e_scenarios }}
      VOICE_E2E_FIELD_TRIALS: ${{ needs.config.outputs.e2e_field_trials }}
      T1: ${{ needs.stage-1.outputs.tested }}
      T2: ${{ needs.stage-2.outputs.tested }}
      T3: ${{ needs.stage-3.outputs.tested }}
      T4: ${{ needs.stage-4.outputs.tested }}
      T5: ${{ needs.stage-5.outputs.tested }}
      E2E_ONLY: ${{ needs.config.outputs.e2e_only }}
      RESUME_RUN: ${{ needs.config.outputs.resume_run }}
      E2E_MODEL: ${{ needs.config.outputs.e2e_model }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: The tested build and the speech bundle
        run: |
          set -euo pipefail
          RUN="$GITHUB_RUN_ID"; STAGE=""
          if [ "$E2E_ONLY" = true ]; then
            RUN="$RESUME_RUN"
            STAGE="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN/artifacts" --paginate \
              -q '.artifacts[] | select(.expired == false) | .name' \
              | sed -nE 's/^molt-s([0-9]+)-meta$/\1/p' | sort -n | tail -1)"
          else
            for n in 1 2 3 4 5; do
              v="T$n"; [ "${!v}" = true ] && STAGE=$n
            done
          fi
          if [ -z "$STAGE" ]; then
            echo "::error::run $RUN has no saved build"; exit 1
          fi
          echo "Build of run $RUN, stage $STAGE"
          mkdir -p "$RUNNER_TEMP/parts" "$RUNNER_TEMP/tree" "$RUNNER_TEMP/bundle"
          gh run download "$RUN" --repo "$GITHUB_REPOSITORY" \
            --pattern "molt-s${STAGE}-p*" --dir "$RUNNER_TEMP/parts"
          find "$RUNNER_TEMP/parts" -mindepth 2 -type f -exec mv -t "$RUNNER_TEMP/parts" {} +
          sudo apt-get install -y -q --no-install-recommends zstd
          cat "$RUNNER_TEMP"/parts/molt-out.tar.zst.* | zstd -d -q -T0 | tar -x -C "$RUNNER_TEMP/tree"
          rm -rf "$RUNNER_TEMP/parts"
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name molt-speech-bundle --dir "$RUNNER_TEMP/bundle"
          chmod +x "$RUNNER_TEMP"/bundle/speech/molt-speech "$RUNNER_TEMP"/bundle/voice/molt-voice 2>/dev/null || true
          ls "$RUNNER_TEMP/tree/out/MoltCI/chrome" "$RUNNER_TEMP/bundle"
      # The engine and voices the suite renders its speech with, pinned
      # (tools/voice_bench/artifacts.json), kept between runs so a download
      # host's outage doesn't stop the suite. Saved on their own: the job
      # fails while the suite is short of Phase 1's exit.
      - name: The pinned voices, kept
        id: voices
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/moltbrowser-voice-e2e/a
          key: voice-e2e-voices-${{ hashFiles('tools/voice_bench/artifacts.json', 'tools/voice_e2e/ci_run.sh') }}
      - name: The pinned voices
        if: steps.voices.outputs.cache-hit != 'true'
        run: tools/voice_e2e/ci_run.sh --fetch-voices
      - name: Keep the pinned voices
        if: steps.voices.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/moltbrowser-voice-e2e/a
          key: ${{ steps.voices.outputs.cache-primary-key }}
      # A real on-device model (e2e_model) for the scenarios that need one,
      # at its pin: the browser hashes a model only while it downloads it,
      # so tools/models/fetch_model.py checks the file's size and SHA-256
      # before the suite links it into each scenario's home, a kept copy
      # included.
      - name: The pinned model, kept
        id: model
        if: env.E2E_MODEL != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/moltbrowser-models
          key: molt-model-${{ env.E2E_MODEL }}-${{ hashFiles('src/chrome/browser/molt_ai/runtime/browser_ai_runtime.cc') }}
      - name: The pinned model
        if: env.E2E_MODEL != ''
        run: |
          set -euo pipefail
          # A hidden entry too: the suite measures a model before it is
          # offered (the kit starts the browser with
          # --molt-ai-test-hidden-models).
          path="$(python3 -I tools/models/fetch_model.py --allow-hidden "$E2E_MODEL" "$HOME/.cache/moltbrowser-models")"
          ls -l "$path"
          echo "VOICE_E2E_MODEL_FILE=$path" >> "$GITHUB_ENV"
      - name: Keep the pinned model
        if: env.E2E_MODEL != '' && steps.model.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/moltbrowser-models
          key: ${{ steps.model.outputs.cache-primary-key }}
      - name: The spoken suite
        id: e2e
        run: |
          set +e
          tools/voice_e2e/ci_run.sh "$RUNNER_TEMP/tree/out/MoltCI" \
            "$RUNNER_TEMP/bundle" "$RUNNER_TEMP/e2e-report"
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ -f "$RUNNER_TEMP/e2e-report/report.md" ]; then
            cat "$RUNNER_TEMP/e2e-report/report.md" >> "$GITHUB_STEP_SUMMARY"
            # Also in the job log, which the API serves when the artifact
            # storage isn't reachable.
            echo "::group::report.md"; cat "$RUNNER_TEMP/e2e-report/report.md"; echo "::endgroup::"
          fi
          if [ -f "$RUNNER_TEMP/e2e-report/digest.txt" ]; then
            echo "::group::digest.txt (the logs of each failure)"
            cat "$RUNNER_TEMP/e2e-report/digest.txt"; echo "::endgroup::"
          fi
          exit 0
      - name: Reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: molt-voice-e2e-report-${{ matrix.name }}
          # Never a model: the suite removes each scenario's link to it.
          path: |
            ${{ runner.temp }}/e2e-report/
            !${{ runner.temp }}/e2e-report/**/.moltbrowser/models/**
          if-no-files-found: ignore
          retention-days: 30
      - name: Phase 1's exit
        env:
          RC: ${{ steps.e2e.outputs.rc }}
        run: |
          case "$RC" in
            0) echo "Phase 1's exit is met." ;;
            1) echo "::error::the spoken suite ran but didn't meet Phase 1's exit (report.md)"; exit 1 ;;
            *) echo "::error::the spoken suite couldn't run (rc $RC)"; exit 1 ;;
          esac

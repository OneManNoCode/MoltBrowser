name: Release

# Triggered by pushing a version tag (git tag v0.2.2 && git push --tags).
# Runs in parallel on whichever self-hosted runners are configured; jobs
# whose runners don't exist will queue forever (mark them as skipped via
# workflow_dispatch input if you only want a subset).
#
# Why not hosted runners?
#   Chromium needs 60+ GB free disk and 16+ GB RAM for incremental builds.
#   GitHub-hosted runners ship with ~14 GB disk. The build won't fit.
#   Either use self-hosted runners (free, runs on your machine), GitHub's
#   Larger Runners (paid by-minute), or a dedicated CI host.
#
# Release integrity:
#   * The release is created as a DRAFT and stays one until the
#     offline-signed molt-release-manifest.json + .sig are uploaded
#     (tools/release_signing/molt_release_sign.py, run OFFLINE). Only then
#     publish it: the updater refuses releases without a valid signature.
#   * Each job publishes SHA256SUMS-<platform> for its assets and a signed
#     SLSA build-provenance attestation (gh attestation verify <file>
#     --repo OneManNoCode/MoltBrowser).
#   * Each installer gets an SPDX 2.3 SBOM next to it (scripts/release-sbom.sh,
#     docs/SBOM.md), named after it with "." -> "-" (never ".dmg"/".deb"/...:
#     the updater picks installers by those). The SBOMs are in the checksums,
#     the attestation and, like every asset, the signed manifest.
#   * The Linux job also attaches the UNSIGNED apt/rpm repository
#     (MoltBrowser-Linux-repository.tar); the owner signs it offline and
#     replaces it before signing the manifest (docs/SIGNED_UPDATES.md).
#
# Required GitHub Secrets (set under Settings → Secrets and variables →
# Actions):
#   MAC_SIGNING_IDENTITY    "Developer ID Application: GenEye AI Labs Inc. (83DA5U8N7Z)"
#   APPLE_ID                the notarization Apple ID (a secret: never write it here)
#   APPLE_TEAM_ID           83DA5U8N7Z
#   APPLE_APP_PASSWORD      the app-specific notary password (xxxx-xxxx-xxxx-xxxx)
#
# Required runner labels:
#   macos:    [self-hosted, macOS, ARM64]   — your Mac
#   linux:    [self-hosted, Linux, X64]     — when you set one up
#   windows:  [self-hosted, Windows, X64]   — when you set one up
#
# Self-hosted Mac runner setup (one-time, ~5 min):
#   1. Repo Settings → Actions → Runners → New self-hosted runner → macOS / ARM64
#   2. Follow the displayed install steps to run ./config.sh and ./run.sh
#   3. Optional: install as a launchd service so it auto-starts after reboot:
#        sudo ./svc.sh install && sudo ./svc.sh start

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Comma-separated platforms to build (macos,linux,windows)'
        required: false
        default: 'macos'

permissions:
  contents: read   # jobs that upload release assets ask for write themselves

env:
  # Bundle downloads must match their pinned hashes; no dev override.
  MOLT_RELEASE_BUILD: "1"

jobs:
  # -------------------------------------------------------------------
  # macOS arm64 — signed + notarized DMG
  # Runs on your Mac via self-hosted runner. Uses existing scripts.
  # -------------------------------------------------------------------
  macos:
    if: ${{ github.event_name == 'push' || contains(github.event.inputs.platforms, 'macos') }}
    runs-on: [self-hosted, macOS, ARM64]
    permissions:
      contents: write       # upload release assets
      id-token: write       # build-provenance attestation (OIDC)
      attestations: write
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Configure environment
        run: |
          echo "PATH=$PWD/depot_tools:/usr/bin:/bin:/usr/sbin:/sbin:/usr/local/bin:$PATH" >> "$GITHUB_ENV"
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # This job reuses the runner's warm chromium/ checkout. The overlay only
      # compiles against chromium_version.txt, so say loudly if it drifted.
      - name: Check chromium/src is at the pinned revision
        shell: bash
        run: |
          tools/chromium/pin.sh env >> "$GITHUB_ENV"
          PIN="$(tools/chromium/pin.sh revision)"
          HEAD_REV="$(git -C chromium/src rev-parse HEAD 2>/dev/null || echo none)"
          if [ "$HEAD_REV" != "$PIN" ]; then
            echo "::warning::chromium/src is at $HEAD_REV, not the pin $PIN from chromium_version.txt (run scripts/setup.sh --resync on this runner)"
          fi

      # The whole overlay, like setup.sh / the Linux workflows (only copying
      # src/chrome/ left components/, third_party/ etc. stale).
      - name: Sync MoltBrowser src/ → chromium/src/
        run: rsync -a --exclude='.git' src/ chromium/src/

      - name: Build chrome target
        run: autoninja -C chromium/src/out/MoltBrowser chrome

      - name: Sign + notarize + DMG
        env:
          MAC_SIGNING_IDENTITY: ${{ secrets.MAC_SIGNING_IDENTITY }}
          APPLE_ID:             ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID:        ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD:   ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          # Refresh the notary keychain profile in case it expired
          xcrun notarytool store-credentials AC_PASSWORD \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD"

          ./scripts/sign-app.sh \
            --identity "$MAC_SIGNING_IDENTITY" \
            --notarize

          mkdir -p dist
          rm -f dist/MoltBrowser-macOS-arm64.dmg
          hdiutil create -volname MoltBrowser \
            -srcfolder chromium/src/out/MoltBrowser/MoltBrowser.app \
            -ov -format UDZO dist/MoltBrowser-macOS-arm64.dmg

      # After signing: the SBOM hashes the shipped (signed) helper binaries.
      - name: SBOM
        run: |
          ./scripts/release-sbom.sh --platform macos --arch arm64 \
            --version "$VERSION" \
            --payload chromium/src/out/MoltBrowser/MoltBrowser.app \
            dist/MoltBrowser-macOS-arm64.dmg

      - name: Checksums
        run: |
          ./scripts/release-checksums.sh dist/SHA256SUMS-macos-arm64 \
            dist/MoltBrowser-macOS-arm64.dmg dist/MoltBrowser-macOS-arm64-dmg.spdx.json

      - name: Build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            dist/MoltBrowser-macOS-arm64.dmg
            dist/MoltBrowser-macOS-arm64-dmg.spdx.json

      - name: Upload to the DRAFT GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./scripts/release-draft.sh "$GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" \
            dist/MoltBrowser-macOS-arm64.dmg dist/MoltBrowser-macOS-arm64-dmg.spdx.json \
            dist/SHA256SUMS-macos-arm64 \
            --clobber

  # -------------------------------------------------------------------
  # Linux x64 — .deb + AppImage
  # Requires a self-hosted Linux runner. Use Ubuntu 22.04+ with Docker
  # if cross-compiling, or run scripts/release-linux.sh natively.
  # -------------------------------------------------------------------
  linux:
    if: ${{ github.event_name == 'workflow_dispatch' && contains(github.event.inputs.platforms, 'linux') }}
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: write       # upload release assets
      id-token: write       # build-provenance attestation (OIDC)
      attestations: write
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Configure environment
        run: |
          echo "PATH=$PWD/depot_tools:/usr/bin:/bin:/usr/sbin:/sbin:/usr/local/bin:$PATH" >> "$GITHUB_ENV"
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # This job reuses the runner's warm chromium/ checkout. The overlay only
      # compiles against chromium_version.txt, so say loudly if it drifted.
      - name: Check chromium/src is at the pinned revision
        shell: bash
        run: |
          tools/chromium/pin.sh env >> "$GITHUB_ENV"
          PIN="$(tools/chromium/pin.sh revision)"
          HEAD_REV="$(git -C chromium/src rev-parse HEAD 2>/dev/null || echo none)"
          if [ "$HEAD_REV" != "$PIN" ]; then
            echo "::warning::chromium/src is at $HEAD_REV, not the pin $PIN from chromium_version.txt (run scripts/setup.sh --resync on this runner)"
          fi

      - name: Sync MoltBrowser src/ → chromium/src/
        run: rsync -a --exclude='.git' src/ chromium/src/

      - name: Build and package
        run: |
          ./scripts/release-linux.sh --version "$VERSION" --build 1

      - name: Collect assets + checksums
        id: assets
        run: |
          shopt -s nullglob
          # This version only: a warm runner keeps older packages in dist/.
          files=("dist/MoltBrowser-${VERSION}-linux-x64.tar.gz" "dist/MoltBrowser-${VERSION}-linux-x64.AppImage" "dist/moltbrowser_${VERSION}_amd64.deb" dist/moltbrowser*"-${VERSION}"-*.rpm)
          for i in "${!files[@]}"; do [ -f "${files[$i]}" ] || unset "files[$i]"; done
          files=("${files[@]}")
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no Linux packages in dist/"
            exit 1
          fi
          # The unsigned apt/rpm repository (signed offline; not in the sums).
          repo_pkgs=()
          for f in "${files[@]}"; do
            case "$f" in *.deb|*.rpm) repo_pkgs+=("$f") ;; esac
          done
          rm -f dist/MoltBrowser-Linux-repository.tar
          if [ ${#repo_pkgs[@]} -gt 0 ]; then
            ./scripts/linux-repo-build.sh dist/MoltBrowser-Linux-repository.tar "${repo_pkgs[@]}"
          fi
          # One SBOM per package (Linux packages bundle no helpers).
          mapfile -t sboms < <(./scripts/release-sbom.sh --platform linux --arch x64 \
            --version "$VERSION" "${files[@]}")
          if [ ${#sboms[@]} -ne ${#files[@]} ]; then
            echo "::error::SBOM generation failed"
            exit 1
          fi
          files+=("${sboms[@]}")
          ./scripts/release-checksums.sh dist/SHA256SUMS-linux-x64 "${files[@]}"
          { echo "files<<EOF"; printf '%s\n' "${files[@]}"; echo "EOF"; } >> "$GITHUB_OUTPUT"

      - name: Build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: ${{ steps.assets.outputs.files }}

      - name: Upload to the DRAFT GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FILES: ${{ steps.assets.outputs.files }}
        run: |
          ./scripts/release-draft.sh "$GITHUB_REF_NAME"
          mapfile -t files <<< "$FILES"
          [ -f dist/MoltBrowser-Linux-repository.tar ] && files+=(dist/MoltBrowser-Linux-repository.tar)
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" dist/SHA256SUMS-linux-x64 --clobber

  # -------------------------------------------------------------------
  # Windows x64 — NSIS Setup.exe
  # Requires a self-hosted Windows runner with Visual Studio Build Tools
  # OR a Linux runner with Docker (cross-compile via release-win.sh --docker).
  # Add code-signing once you have an EV cert.
  # -------------------------------------------------------------------
  windows:
    if: ${{ github.event_name == 'workflow_dispatch' && contains(github.event.inputs.platforms, 'windows') }}
    runs-on: [self-hosted, Windows, X64]
    permissions:
      contents: write       # upload release assets
      id-token: write       # build-provenance attestation (OIDC)
      attestations: write
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Configure environment
        shell: bash
        run: |
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # This job reuses the runner's warm chromium/ checkout. The overlay only
      # compiles against chromium_version.txt, so say loudly if it drifted.
      - name: Check chromium/src is at the pinned revision
        shell: bash
        run: |
          tools/chromium/pin.sh env >> "$GITHUB_ENV"
          PIN="$(tools/chromium/pin.sh revision)"
          HEAD_REV="$(git -C chromium/src rev-parse HEAD 2>/dev/null || echo none)"
          if [ "$HEAD_REV" != "$PIN" ]; then
            echo "::warning::chromium/src is at $HEAD_REV, not the pin $PIN from chromium_version.txt (run scripts/setup.sh --resync on this runner)"
          fi

      - name: Sync MoltBrowser src/ → chromium/src/
        shell: bash
        run: rsync -a --exclude='.git' src/ chromium/src/

      - name: Build and package
        shell: bash
        run: |
          ./scripts/release-win.sh --version "$VERSION" --build 1

      - name: Collect assets + checksums
        id: assets
        shell: bash
        run: |
          shopt -s nullglob
          # This version only: a warm runner keeps older packages in dist/.
          files=("dist/MoltBrowser-${VERSION}-win-x64-setup.exe" "dist/MoltBrowser-${VERSION}-win-x64-portable.zip")
          for i in "${!files[@]}"; do [ -f "${files[$i]}" ] || unset "files[$i]"; done
          files=("${files[@]}")
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no Windows packages in dist/"
            exit 1
          fi
          # package-win.sh bundles no helpers (the SBOM tool checks the zip).
          mapfile -t sboms < <(./scripts/release-sbom.sh --platform windows --arch x64 \
            --version "$VERSION" "${files[@]}")
          if [ ${#sboms[@]} -ne ${#files[@]} ]; then
            echo "::error::SBOM generation failed"
            exit 1
          fi
          files+=("${sboms[@]}")
          ./scripts/release-checksums.sh dist/SHA256SUMS-windows-x64 "${files[@]}"
          { echo "files<<EOF"; printf '%s\n' "${files[@]}"; echo "EOF"; } >> "$GITHUB_OUTPUT"

      - name: Build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: ${{ steps.assets.outputs.files }}

      - name: Upload to the DRAFT GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FILES: ${{ steps.assets.outputs.files }}
        run: |
          ./scripts/release-draft.sh "$GITHUB_REF_NAME"
          mapfile -t files <<< "$FILES"
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" dist/SHA256SUMS-windows-x64 --clobber

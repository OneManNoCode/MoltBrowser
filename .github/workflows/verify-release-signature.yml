name: Verify release signature

# Independently re-checks every published release the way installed
# browsers do: the release must carry molt-release-manifest.json + .sig,
# the signature must verify against a key trusted in
# src/chrome/browser/molt_ai/update/update_signing_keys.cc, and the attached
# assets must be exactly the signed ones with matching sizes and SHA-256.
# A red run here means users' browsers will refuse the update.
# Runbook: docs/SIGNED_UPDATES.md

on:
  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to verify (e.g. v0.3.0)'
        required: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install verifier dependency
        run: python3 -m pip install --user 'cryptography==46.0.3'
      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir assets
      - name: Verify signed manifest and assets
        run: |
          python3 tools/release_signing/molt_release_sign.py verify \
            --manifest assets/molt-release-manifest.json \
            --sig assets/molt-release-manifest.json.sig \
            --require-all assets/*

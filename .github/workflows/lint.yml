name: Lint

# Static checks that need no Chromium checkout:
#   * actionlint on every workflow, including shellcheck on their run: blocks
#     (blocking)
#   * shellcheck on the build/release shell scripts (non-blocking for now:
#     scripts owned by several people still carry a few warnings)
#   * patches/ still reproduces the src/ overlay byte-for-byte, and every
#     DEPS-subproject whole file was merged with the subproject commit the
#     pin has (tools/chromium/verify_patches.py; non-blocking until the
#     patch series becomes the build input, see docs/REBASING.md); the
#     patch tools' own tests run in the compile-check-harness job (blocking)
#   * the macOS helper dylib bundler (scripts/macho_bundle_deps.py) against
#     arm64 Mach-O fixtures built with clang + lld (blocking)
#   * the release SBOM generator (tools/sbom/) against its fixtures and this
#     repository, with every SBOM also checked by the official SPDX
#     validator (blocking)
#   * the signed build provenance (tools/release_signing/): generation from
#     fake checkouts, scrubbing, signing with a throwaway key, tampering, the
#     release and publish scripts, and every bundle checked by
#     securesystemslib's DSSE verifier and the in-toto SLSA v1 schema
#     (blocking)
#   * the signed apt/rpm repository tooling (tools/linux_repo/): a .deb and
#     an .rpm built in the test, a throwaway GnuPG key, gpgv, rpmkeys,
#     createrepo_c and `apt-get update` against the result (blocking)
#   * release asset names (scripts/release_asset_names_test.py): the names
#     the release scripts and workflows give the installers are the ones
#     the in-app updater downloads and the release tooling accepts, and
#     package-linux.sh, run on a fake build, writes them (blocking; in the
#     linux-repo job, which has dpkg-deb and rpmbuild)
#   * the model pinning tool (tools/models/pin_models.py) parses both model
#     registries and pins a copy offline; a half-filled pin fails; the
#     survey that checks them against Hugging Face (hf_survey.py) offline
#     (blocking)
#   * the MoltNet font tooling (tools/fonts/): the font reader against
#     hostile input, the pinned font manifest's rules, the generated Blink
#     and browser tables and allow-list copy are current, fetching and
#     installing from a fake server, and the fresh-install inventory with
#     its Perl collector (blocking)
#   * the voice command references (docs/VOICE_COMMANDS.md and its Spanish
#     page, VOICE_COMMANDS.es.md) are the ones the grammar's phrase tables
#     generate, and their examples parse (tools/voice/voice_commands_doc.py;
#     blocking); every sentence the voice loop says has its Spanish
#     (tools/voice/check_spoken_answers.py; blocking)
#   * the MoltNet leak test kit (tools/leak_test/): capture reader,
#     dissectors, classification, uniformity rules and report against a
#     recorded sample run, its servers and DevTools pipe client; shellcheck
#     on its scripts (blocking; the kit itself needs a built browser and
#     root, see docs/LEAK_TESTING.md)
#   * the voice bench kit (tools/voice_bench/): test set rules, scoring,
#     hotword and SentencePiece/ONNX readers, safe unpacking and the pinned
#     manifest; shellcheck on its script (blocking; the measurements
#     themselves download engines, see docs/VOICE_BENCH.md)
#   * the voice end-to-end kit (tools/voice_e2e/): its scenarios, their
#     expectations, the test log reader, the report, the fixture server,
#     the speech renderer's determinism (with a stand-in voice) and the
#     runner against a stand-in browser over the DevTools pipe; shellcheck
#     on its script (blocking; the suite itself runs against a build, see
#     docs/VOICE_E2E.md)
#   * fuzz smoke: the libFuzzer targets that need no //base (std, zlib and
#     llama tiers) built with clang + ASan/UBSan and run over their seed
#     corpora with a fixed seed and run count (tools/fuzz/molt_fuzz.py;
#     blocking; see docs/FUZZING.md)
#   * the static GN checks against the pinned Chromium's own build files
#     (tools/chromium/gn_static_check.py): gn check's include and
#     dependency rules on six configs, checkdeps, Blink's audit, test
#     sources no test binary builds and the test data they open, and the
#     chrome://flags entries. The pin's GN files are streamed from the
#     release tarball once per pin (SHA-256 pinned) and cached (blocking)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ACTIONLINT_VERSION: "1.7.12"
      # sha256 of actionlint_1.7.12_linux_amd64.tar.gz, from the release's
      # actionlint_1.7.12_checksums.txt.
      ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint (pinned, checksum-verified)
        run: |
          set -euo pipefail
          # Retried: GitHub's release downloads sometimes answer 504.
          curl -fsSL --retry 5 --retry-delay 10 --retry-connrefused \
            -o "$RUNNER_TEMP/actionlint.tgz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/actionlint.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tgz" -C "$RUNNER_TEMP" actionlint
          command -v shellcheck >/dev/null || sudo apt-get install -y --no-install-recommends shellcheck
      - name: actionlint
        run: '"$RUNNER_TEMP/actionlint" -color'

  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true   # report-only for now; see the header
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck (warnings and errors)
        run: |
          command -v shellcheck >/dev/null || sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck --version | head -2
          shellcheck -S warning scripts/*.sh build/docker/*.sh tools/chromium/*.sh

  patches-in-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true   # report-only until patches/ is the build input
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # The pinned Chromium trees and the upstream files patches/ needs, so
      # the slow tree fetch from the mirror only happens when the pin
      # changes. A new patch series saves a new entry (restored from the
      # closest one), so newly imported files are fetched once, not per run.
      - name: Cache the pinned Chromium trees
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .molt-chromium-cache
          key: chromium-upstream-${{ hashFiles('chromium_version.txt') }}-${{ hashFiles('patches/series') }}
          restore-keys: |
            chromium-upstream-${{ hashFiles('chromium_version.txt') }}
      - name: patches/ reproduces src/ (fetches upstream@pin from the GitHub mirror)
        run: python3 tools/chromium/verify_patches.py

  macho-bundle-deps:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install clang, lld and LLVM's otool / install_name_tool
        run: |
          # A stalled mirror times out and is retried instead of hanging the job.
          echo 'Acquire::Retries "5"; Acquire::http::Timeout "30"; Acquire::https::Timeout "30";' |
            sudo tee /etc/apt/apt.conf.d/80-molt-ci-retries > /dev/null
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends clang lld llvm
      - name: scripts/macho_bundle_deps_test.py
        run: MOLT_REQUIRE_MACHO_TOOLS=1 python3 scripts/macho_bundle_deps_test.py -v

  sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install the SPDX validator (spdx-tools, pinned)
        run: python3 -m pip install --user 'spdx-tools==0.8.3'
      - name: tools/sbom/molt_sbom_test.py (fixtures, golden files, this repository)
        run: |
          MOLT_SPDX_TOOLS="$(python3 -m site --user-base)/bin/pyspdxtools" \
            MOLT_REQUIRE_SPDX_TOOLS=1 python3 tools/sbom/molt_sbom_test.py -v

  build-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install the signing tool's dependency and the interop checkers (pinned)
        run: |
          python3 -m pip install --user 'cryptography==46.0.3' \
            'securesystemslib==1.6.0' 'in-toto-attestation==0.9.3'
      - name: tools/release_signing/molt_provenance_test.py (throwaway keys)
        run: MOLT_REQUIRE_INTEROP=1 python3 tools/release_signing/molt_provenance_test.py -v

  linux-repo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install dpkg-dev, rpm, createrepo_c, apt-utils, gnupg
        run: |
          # A stalled mirror times out and is retried instead of hanging the job.
          echo 'Acquire::Retries "5"; Acquire::http::Timeout "30"; Acquire::https::Timeout "30";' |
            sudo tee /etc/apt/apt.conf.d/80-molt-ci-retries > /dev/null
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            dpkg-dev rpm createrepo-c apt-utils gnupg gpgv
      - name: tools/linux_repo/molt_linux_repo_test.py (throwaway keys)
        run: MOLT_REQUIRE_REPO_TOOLS=1 python3 tools/linux_repo/molt_linux_repo_test.py -v
      - name: scripts/release_asset_names_test.py (installer names vs the updater)
        run: MOLT_REQUIRE_PACKAGE_TOOLS=1 python3 scripts/release_asset_names_test.py -v

  model-pins:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: tools/models/pin_models_test.py (offline, both registries)
        run: python3 tools/models/pin_models_test.py -v
      - name: tools/models/hf_survey_test.py (offline, stand-in replies)
        run: python3 tools/models/hf_survey_test.py -v
      - name: tools/models/fetch_model_test.py (offline, a stand-in download)
        run: python3 tools/models/fetch_model_test.py -v
      - name: tools/models/gguf_types_test.py (GGUF types vs the Vulkan build)
        run: python3 tools/models/gguf_types_test.py -v

  fonts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: tools/fonts/fonts_test.py (offline)
        run: python3 -I tools/fonts/fonts_test.py -v
      - name: The generated font tables match tools/fonts/moltnet_fonts.json
        run: python3 -I tools/fonts/generate_tables.py

  voice-commands-doc:
    # docs/VOICE_COMMANDS.md and docs/VOICE_COMMANDS.es.md are generated
    # from the voice grammar's phrase tables (std-only C++, built with the
    # runner's compiler); their examples must parse to their commands. The
    # voice loop's sentences each have a Spanish one (spoken_answers_es.cc).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: docs/VOICE_COMMANDS.md and .es.md match the phrase tables
        run: python3 -I tools/voice/voice_commands_doc.py
      - name: What the voice loop says has its Spanish
        run: python3 -I tools/voice/check_spoken_answers.py

  compile-check-harness:
    # The harness's own logic, offline. The compile check itself needs hours
    # and about 2 GB, so it runs on a developer machine, not here.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: tools/compile_check/compile_check_test.py
        run: python3 tools/compile_check/compile_check_test.py -v
      # The static gn check's own logic (the check itself streams Chromium's
      # source tarball once, so it runs on a developer machine).
      - name: tools/chromium/gn_static_check_test.py
        run: python3 tools/chromium/gn_static_check_test.py -v
      # The patch tools (overlay_to_patches, verify_patches, rebase) and
      # their DEPS-subproject whole files, against a fake Chromium, its
      # mirrors and release tarballs built in the test.
      - name: tools/chromium/patch_tools_test.py
        run: python3 tools/chromium/patch_tools_test.py -v

  gn-static-check:
    # The checks themselves, against the pin's BUILD.gn files with src/ on
    # top (docs/BUILD_MACHINE_CHECKLIST.md, "First build"). A cache miss
    # (a new pin) streams the release tarball once, about 5 minutes; the
    # pinned tree's file list (test data the tarball leaves out) and the
    # upstream copies the tree lacks come from the GitHub mirror.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Cache the pin's GN files
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .molt-gn-check-cache
          key: gn-tree-${{ hashFiles('chromium_version.txt', 'tools/compile_check/ccheck/tarball.py') }}
      # Trees only (blob-less); its own key, so it doesn't take the place of
      # patches-in-sync's cache with the patched files' contents.
      - name: Cache the pinned tree's file list
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .molt-chromium-cache
          key: chromium-trees-${{ hashFiles('chromium_version.txt') }}
      - name: Fetch the pin's GN files (on a cache miss)
        run: |
          set -euo pipefail
          version="$(tools/chromium/pin.sh version)"
          if [ ! -d ".molt-gn-check-cache/$version/tree" ]; then
            python3 tools/chromium/gn_static_check.py fetch
          fi
      - name: gn check's include and dependency rules (six configs)
        run: python3 tools/chromium/gn_static_check.py check
      - name: checkdeps
        run: python3 tools/chromium/gn_static_check.py checkdeps
      - name: Blink's audit_non_blink_usage
        run: python3 tools/chromium/gn_static_check.py blink-audit
      - name: Test sources no test binary builds, and the data they open
        run: python3 tools/chromium/gn_static_check.py tests --warnings
      - name: chrome://flags entries and their metadata
        run: python3 tools/chromium/gn_static_check.py flags --warnings

  leak-test-kit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck tools/leak_test
        run: |
          command -v shellcheck >/dev/null || sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck tools/leak_test/*.sh tools/leak_test/leakkit/*.sh
      - name: tools/leak_test unit tests (no root, no browser)
        run: python3 -I -m unittest discover -s tools/leak_test/tests -t tools/leak_test -v

  voice-bench-kit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck tools/voice_bench
        run: |
          command -v shellcheck >/dev/null || sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck tools/voice_bench/*.sh
      - name: tools/voice_bench tests (no downloads, no engines)
        run: python3 -I tools/voice_bench/voice_bench_test.py -v

  voice-e2e-kit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck tools/voice_e2e
        run: |
          command -v shellcheck >/dev/null || sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck tools/voice_e2e/*.sh
      # A venv: "python3 -I" ignores the user site that "pip --user" installs
      # into, which left the renderer's tests skipped.
      - name: numpy, pinned by hash (the renderer's and the mixes' tests)
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install -q --require-hashes -r tools/voice_bench/requirements.txt
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: The scenarios load
        run: python3 -I tools/voice_e2e/run_e2e.py list
      - name: tools/voice_e2e tests (no browser, no downloads)
        run: |
          python3 -I -c "import numpy; print('numpy', numpy.__version__)"
          python3 -I -m unittest discover -s tools/voice_e2e/tests -t tools/voice_e2e -v

  fuzz-smoke:
    runs-on: ubuntu-latest
    # The runs are bounded by count (each fuzzer's smoke_runs) with a 60 s
    # guard each; this caps the whole job.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install clang with libFuzzer and the sanitizer runtimes, zlib
        run: |
          # A stalled mirror times out and is retried instead of hanging the job.
          echo 'Acquire::Retries "5"; Acquire::http::Timeout "30"; Acquire::https::Timeout "30";' |
            sudo tee /etc/apt/apt.conf.d/80-molt-ci-retries > /dev/null
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends clang libclang-rt-dev zlib1g-dev
          clang++ --version | head -1
      - name: Every fuzzer is a GN fuzzer_test with the same options and seeds
        run: python3 tools/fuzz/molt_fuzz.py check
      - name: Build and run the std, zlib and llama fuzzers (fixed seed and runs)
        run: python3 tools/fuzz/molt_fuzz.py smoke --seed 1
      - name: Keep the inputs that failed
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: fuzz-smoke-artifacts
          path: out/fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 7

# Keeps the SHA-pinned actions in .github/workflows current. Dependabot
# understands `uses: owner/repo@<sha>  # vX.Y.Z` and bumps both the SHA and
# the version comment.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "CI"

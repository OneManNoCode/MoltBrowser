<!DOCTYPE html>
<!-- The embedded player (frame_player.html): a <video> a click on it plays,
     a "Full screen" button and a media session that has a next video, as
     embedded players offer. It records what happened for the test. -->
<html>
<head>
<meta charset="utf-8">
<title>Player</title>
</head>
<body>
<video id="player" src="/media/bigbuck.webm" preload="auto" width="640"
       height="360" aria-label="Embedded video player"></video>
<button id="fullscreen" type="button">Full screen</button>
<script>
  const player = document.getElementById('player');
  window.events = {next: 0, fullscreen: false};
  player.addEventListener('click', () => {
    if (player.paused) {
      player.play();
    } else {
      player.pause();
    }
  });
  document.getElementById('fullscreen').addEventListener('click', () => {
    player.requestFullscreen().then(() => { window.events.fullscreen = true; },
                                    () => {});
  });
  navigator.mediaSession.setActionHandler('nexttrack', () => {
    window.events.next++;
  });
</script>
</body>
</html>

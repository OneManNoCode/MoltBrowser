<!-- MoltNet leak kit test page: DNS prefetch and preconnect. Served by leakkit/services.py,
     which fills in the {{...}} values for this test. -->
<html lang="en" data-nonce="{{NONCE}}" data-canary="{{CANARY}}"
    data-cip4="{{CIP4}}" data-cip6="{{CIP6}}" data-lport="{{LPORT}}"
    data-gw="{{GW}}" data-gw6="{{GW6}}" data-nsip="{{NSIP}}"
    data-base-http="{{BASE_HTTP}}" data-base-https="{{BASE_HTTPS}}"
    data-base-b-https="{{BASE_B_HTTPS}}" data-onion-a="{{ONION_A}}">
<head>
<meta charset="utf-8">
<title>moltleak: DNS prefetch and preconnect</title>
<link rel="dns-prefetch" href="//{{H:dnsprefetch}}">
<link rel="preconnect" href="https://{{H:preconnect}}">
<link rel="preconnect" href="https://{{H:preconnectcors}}" crossorigin>
<link rel="dns-prefetch" href="//{{CIP4}}">
<script type="speculationrules">{"prefetch": [{"source": "list", "urls": ["https://{{H:specprefetch}}/"], "eagerness": "immediate"}], "prerender": [{"source": "list", "urls": ["https://{{H:specprerender}}/"], "eagerness": "immediate"}]}</script>
<script src="/static/ml.js"></script>
</head>
<body>
<p><a id="anchor" href="https://{{H:anchor}}/">a link to hover</a></p>
<p><a id="anchor2" href="http://{{CIP4}}:8080/">an IP link to hover</a></p>
<script src="/static/dnsprefetch.js"></script>
</body>
</html>

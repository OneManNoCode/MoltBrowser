<!DOCTYPE html>
<!-- An encyclopedia's home page, served as en.wikipedia.org: a search form
     (role=search) and a featured article. Its search, and /wiki/..., show
     article.html. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wikipedia, the free encyclopedia</title>
<link rel="stylesheet" href="/_kit/kit.css">
</head>
<body>
<header>
  <form id="searchform" action="/w/index.php" role="search">
    <input id="searchInput" name="search" type="search" aria-label="Search Wikipedia">
    <button type="submit">Search</button>
  </form>
</header>
<main>
  <h1>Welcome to Wikipedia</h1>
  <h2>From today's featured article</h2>
  <p>The <a href="/wiki/Lyon_tramway">Lyon tramway</a> is a network of
     tram lines in the city of Lyon, France.</p>
</main>
</body>
</html>

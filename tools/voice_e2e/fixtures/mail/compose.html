<!DOCTYPE html>
<!-- Writing a message (mail.test/compose): To, Subject, the message, and
     "Send" (voice mode asks before it presses it). It goes to /sent. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>New message - Post</title>
<link rel="stylesheet" href="/_kit/kit.css">
</head>
<body>
<nav><a href="/">Inbox</a></nav>
<main>
  <h1>New message</h1>
  <form id="compose" action="/sent" method="get">
    <label for="to">To</label>
    <input id="to" name="to" autocomplete="off">
    <label for="subject">Subject</label>
    <input id="subject" name="subject" autocomplete="off">
    <label for="body">Message</label>
    <textarea id="body" name="body" rows="5" cols="50"></textarea>
    <button id="send" type="submit">Send</button>
  </form>
</main>
</body>
</html>

<!DOCTYPE html>
<!-- A message (mail.test/message?id=N): who from, the subject, the text. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Message - Post</title>
<link rel="stylesheet" href="/_kit/kit.css">
<script src="/_kit/kit.js"></script>
</head>
<body>
<nav><a href="/">Inbox</a> <a href="/compose">Compose</a></nav>
<main>
  <h1 id="subject"></h1>
  <p>From <span id="from"></span></p>
  <p id="body"></p>
</main>
<script>
  const MESSAGES = {
    1: ['Grace Hopper', 'Lunch on Friday', 'Shall we meet at noon by the river?'],
    2: ['Alan Turing', 'The chess problem', 'White to move and win in three.'],
    3: ['Library', 'Your books are due', 'Two books are due back on Thursday.'],
    4: ['Ada Lovelace', 'Notes on the engine', 'The notes are attached, with the tables.'],
    5: ['Bakery', 'Bread of the week', 'This week we bake rye bread with seeds.'],
  };
  const m = MESSAGES[kit.param('id')] || MESSAGES[1];
  document.getElementById('from').textContent = m[0];
  document.getElementById('subject').textContent = m[1];
  document.getElementById('body').textContent = m[2];
  document.title = m[1] + ' - Post';
</script>
</body>
</html>
